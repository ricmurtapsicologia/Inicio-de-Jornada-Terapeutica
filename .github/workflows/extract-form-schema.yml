name: Inspect public form schemas
on:
  push:
    branches: [fix/hidden-form-engine-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public control form definition
        shell: bash
        run: |
          cat > /tmp/inspect.mjs <<'EOF'
          const id='controle';
          const url='https://docs.google.com/forms/d/e/1FAIpQLSfvrCtU4hn72xCYHPizP60GMIiRAm45KM-1k3z5_8VIOj6dMQ/viewform';
          const html = await (await fetch(url)).text();
          const match = html.match(/FB_PUBLIC_LOAD_DATA_\s*=\s*(\[.*?\]);\s*<\/script>/s);
          if (!match) throw new Error('NO_FB_PUBLIC_LOAD_DATA');
          const data = JSON.parse(match[1]);
          const simplifyChoices = raw => Array.isArray(raw) ? raw.map(x => Array.isArray(x) ? x[0] : x).filter(x => typeof x === 'string') : [];
          const items = data?.[1]?.[1] || [];
          const fields = items.map((item,index) => ({index,itemId:item?.[0]??null,title:item?.[1]??'',description:item?.[2]??'',type:item?.[3]??null,entryId:item?.[4]?.[0]?.[0]??null,choices:simplifyChoices(item?.[4]?.[0]?.[1]),required:Boolean(item?.[4]?.[0]?.[2])}));
          console.log(JSON.stringify({id,title:data?.[1]?.[8]||'',description:data?.[1]?.[0]||'',fields},null,2));
          EOF
          node /tmp/inspect.mjs
