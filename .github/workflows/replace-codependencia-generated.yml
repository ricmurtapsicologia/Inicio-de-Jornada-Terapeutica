name: Substituir imagem de codependência

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-codependencia-generated.yml

permissions:
  contents: write

jobs:
  replace-audit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar imagem aprovada, auditar e testar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, sys

          IMG_B64 = '''[... ELLIPSIZATION ...]'''

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_url = 'https://images.unsplash.com/photo-1645476074517-c9ca9c8ef129?auto=format&fit=crop&w=1200&h=788&q=82'
          new_url = 'assets/dependencia-codependencia-casal.jpg'
          old_alt = 'Duas pessoas de mãos dadas, representando vínculo, conexão e autonomia emocional'
          new_alt = 'Homem e mulher em momento de apoio emocional, vínculo e conversa acolhedora'

          if html.count(old_url) != 1:
              raise SystemExit(f'Esperava 1 ocorrência da imagem anterior, encontrei {html.count(old_url)}.')

          Path('assets').mkdir(exist_ok=True)
          img = Path(new_url)
          img.write_bytes(base64.b64decode(IMG_B64))

          html = html.replace(old_url, new_url, 1)
          if old_alt in html:
              html = html.replace(old_alt, new_alt, 1)
          index.write_text(html, encoding='utf-8')

          # Auditoria 1 — visual/semântica por critérios verificáveis
          card_match = re.search(r'<article class="service"[^>]*>.*?<h3>Dependência e Codependência Emocional</h3>.*?</article>', html, re.S)
          card = card_match.group(0) if card_match else ''
          audit1 = {
              'card localizado': bool(card),
              'imagem local específica': new_url in card,
              'alt semântico': new_alt in card,
              'representação homem e mulher no alt': 'Homem e mulher' in card,
              'descrição clínica preservada': 'autonomia emocional' in card and 'relações mais recíprocas e seguras' in card,
              'CTA preservado': 'Agende Agora' in card and 'api.whatsapp.com/send?' in card,
          }

          # Auditoria 2 — técnica/funcional
          jpg = img.read_bytes()
          audit2 = {
              'arquivo existe': img.exists(),
              'JPEG válido por assinatura': jpg[:2] == b'\xff\xd8' and jpg[-2:] == b'\xff\xd9',
              'arquivo não vazio': len(jpg) > 15000,
              'imagem antiga removida': old_url not in html,
              'nova referência única': html.count(new_url) == 1,
              'lazy loading preservado': 'loading="lazy"' in card,
              'decoding async preservado': 'decoding="async"' in card,
              'dimensões HTML preservadas': 'width="640"' in card and 'height="420"' in card,
              'cinco cards preservados': len(re.findall(r'<article class="service"', html)) == 5,
              'responsividade preservada': '@media (max-width: 600px)' in html and '@media (max-width: 1024px)' in html,
          }

          for label, checks in [('AUDITORIA VISUAL/SEMÂNTICA', audit1), ('AUDITORIA TÉCNICA/FUNCIONAL', audit2)]:
              print('\n' + label)
              for name, ok in checks.items():
                  print(f'  [{"PASS" if ok else "FAIL"}] {name}')
              if not all(checks.values()):
                  raise SystemExit(f'{label} reprovada.')

          # Smoke test final
          smoke = {
              'HTML principal presente': '<!DOCTYPE html>' in html,
              'seção Áreas de Atuação presente': 'Áreas de Atuação' in html,
              'card de codependência presente': 'Dependência e Codependência Emocional' in html,
              'imagem nova referenciada': new_url in html,
              'arquivo de imagem gravado': img.exists(),
              'CTA do card preservado': 'Agende Agora' in card,
              'JS de interação preservado': 'const serviceCards = qsa(".service");' in html,
              'formulários preservados': 'id="forms"' in html,
          }
          print('\nSMOKE TEST FINAL')
          for name, ok in smoke.items():
              print(f'  [{"PASS" if ok else "FAIL"}] {name}')
          if not all(smoke.values()):
              raise SystemExit('Smoke test reprovado.')

          print('\nRESULTADO: substituição aprovada pelas duas auditorias e pelo smoke test.')
          PY

      - name: Publicar alteração auditada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/dependencia-codependencia-casal.jpg
          git commit -m "Substitui imagem de codependência por casal homem e mulher"
          git push
