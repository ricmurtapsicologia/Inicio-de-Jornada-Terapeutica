name: Cleanup temporary RC workflows

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/cleanup-rc-workflows.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
          fetch-depth: 0
      - name: Remove one-time migration and diagnostic workflows
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/audit-clinical-item-boundaries-rc.yml \
            .github/workflows/audit-question-title-quality-rc.yml \
            .github/workflows/build-forms-factory-stage-rc.yml \
            .github/workflows/build-scoring-config-v3-rc.yml \
            .github/workflows/capture-screening-mirror-specs-rc.yml \
            .github/workflows/decouple-screening-runtime.yml \
            .github/workflows/diagnose-modos-404-rc.yml \
            .github/workflows/e2e-autoestima-live.yml \
            .github/workflows/e2e-icaps-final-live.yml \
            .github/workflows/e2e-live-resumable-15.yml \
            .github/workflows/e2e-post-sanitize-15.yml \
            .github/workflows/final-sanitize-catalog-rc.yml \
            .github/workflows/finalize-clinical-specs-rc.yml \
            .github/workflows/finalize-scoring-v3-rc.yml \
            .github/workflows/fix-bipolar-mdq-label-rc.yml \
            .github/workflows/fix-icaps-identity-contract-rc.yml \
            .github/workflows/fix-icaps-scale-final-rc.yml \
            .github/workflows/fix-icaps-scale-scoring-rc.yml \
            .github/workflows/live-webapp-health-rc.yml \
            .github/workflows/live-webapp-post-probe-rc.yml \
            .github/workflows/migrate-screening-config-to-hub-rc.yml \
            .github/workflows/rastreios-hero-variants-rc.yml \
            .github/workflows/repair-borderline-risk-specs-rc.yml \
            .github/workflows/resolve-anomalies-freeze-rc.yml \
            .github/workflows/scoring-runtime-tests-v3-rc.yml \
            .github/workflows/scoring-source-inventory-rc.yml \
            .github/workflows/scoring-v3-recovery-rc.yml \
            .github/workflows/screening-bridge-v3-static-rc.yml \
            .github/workflows/screening-report-integrations-v3-static-rc.yml \
            .github/workflows/stage-monitoring-forms-rc.yml \
            .github/workflows/wire-postprocessing-v3-rc.yml \
            .github/workflows/cleanup-rc-workflows.yml
      - name: Verify permanent workflow set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={
            'anamnese-quality.yml',
            'build-screening-backend-bundle.yml',
            'monitoring-bridge-v2.yml',
            'ordered-transport-v31-gate.yml',
            'questionnaire-quality.yml',
            'release-preflight-v31.yml'
          }
          actual={p.name for p in Path('.github/workflows').glob('*.yml')}
          extra=actual-expected
          missing=expected-actual
          if missing: raise SystemExit('MISSING_PERMANENT_WORKFLOWS:'+','.join(sorted(missing)))
          if extra: raise SystemExit('UNCLASSIFIED_WORKFLOWS:'+','.join(sorted(extra)))
          print('WORKFLOW_SET_CLEAN_PASS')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove workflows temporários da RC'
          git push
