name: Unify 15 banners and identity RC

on:
  push:
    branches:
      - rastreios-visual-identity-20260908
    paths:
      - '.github/workflows/unify-15-banners-identity-rc.yml'
      - 'tools/unify_visual_identity.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-visual-identity-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/unify_visual_identity.py
      - name: Write visual regression test
        run: |
          cat > tests/visual-identity-15.test.mjs <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js=fs.readFileSync('assets/screening-system-v2.js','utf8');
          const css=fs.readFileSync('assets/screening-system-v2.css','utf8');
          const loader=fs.readFileSync('assets/screening-uniformity-v1.js','utf8');
          const ids=['geral','tdah','bipolar','borderline','narcisismo','impulsividade','esquemas','modos','necessidades','codependencia','icaps','risco','humor','ansiedade','autoestima'];
          assert.doesNotThrow(()=>new Function(js));
          for(const id of ids) assert.match(js,new RegExp(`\\b${id}:\\{alt:`),`hero missing ${id}`);
          assert.equal((js.match(/alt:'/g)||[]).length,15);
          assert.match(js,/heroForInstrument\(instrumentId\)/);
          assert.match(js,/showBirth=true/);
          assert.match(js,/showApplication=true/);
          assert.match(js,/cleanupLegacyIdentity/);
          assert.match(js,/ageFromBirth/);
          assert.match(css,/data-rm-legacy-identity/);
          assert.match(css,/filter:grayscale\(1\)/);
          assert.match(loader,/screening-system-v2\.js\?v=2\.3\.0/);
          console.log('VISUAL_IDENTITY_15_PASS');
          NODE
      - name: Regression gates
        run: |
          node tests/visual-identity-15.test.mjs
          node tests/bdi2-content-lock.test.mjs
          node tests/hero-variants.test.mjs
          node tests/branded-questionnaires.test.mjs
          node tests/ordered-transport-v31.test.mjs
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screening-system-v2.js assets/screening-system-v2.css assets/screening-uniformity-v1.js assets/screening-uniformity-v1.css tests/visual-identity-15.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Unifica banner e identificação nos 15 rastreios'
          git push
