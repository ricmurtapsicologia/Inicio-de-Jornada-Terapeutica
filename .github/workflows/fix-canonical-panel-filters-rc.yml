name: Fix canonical panel filters RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/fix-canonical-panel-filters-rc.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Derive filters from canonical catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('painel-rastreios/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="filters" role="group" aria-label="Filtrar por área"><button class="filter" data-filter="Todos" aria-pressed="true">Todos</button><button class="filter" data-filter="Geral">Geral</button><button class="filter" data-filter="Humor">Humor</button><button class="filter" data-filter="Personalidade">Personalidade</button><button class="filter" data-filter="Terapia do Esquema">Terapia do Esquema</button><button class="filter" data-filter="Relacionamentos">Relacionamentos</button><button class="filter" data-filter="Monitoramento">Monitoramento</button><button class="filter" data-filter="Uso clínico restrito">Uso clínico restrito</button></div>'
          new='<div id="filters" class="filters" role="group" aria-label="Filtrar por área"></div>'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('FILTER_CONTAINER_TARGET_NOT_FOUND')
          anchor="let active='Todos',term='';"
          inject="""let active='Todos',term='';
const filtersHost=document.getElementById('filters');
['Todos',...ORDER].forEach((label,index)=>{const b=document.createElement('button');b.className='filter';b.type='button';b.dataset.filter=label;b.setAttribute('aria-pressed',String(index===0));b.textContent=label;filtersHost.appendChild(b)});"""
          if inject not in s:
              if anchor not in s: raise SystemExit('FILTER_JS_ANCHOR_NOT_FOUND')
              s=s.replace(anchor,inject,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Gate canonical filters
        run: |
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('painel-rastreios/index.html','utf8');
          if(!s.includes("['Todos',...ORDER]"))throw new Error('FILTERS_NOT_DERIVED_FROM_ORDER');
          if(!s.includes('id="filters"'))throw new Error('FILTER_HOST_MISSING');
          if(/data-filter="Geral"/.test(s))throw new Error('HARDCODED_FILTER_RESIDUE');
          console.log('CANONICAL_PANEL_FILTERS_PASS');
          NODE
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- painel-rastreios/index.html)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel-rastreios/index.html
          git commit -m 'Deriva filtros do painel do catálogo canônico'
          git push
