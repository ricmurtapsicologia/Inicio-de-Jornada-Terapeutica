name: Stage canonical monitoring Forms RC
on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/stage-monitoring-forms-rc.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Extract current monitoring schemas without changing clinical content
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('assets/monitoramentos-v2.js','utf8');
          function balanced(src,start,open,close){let d=0,q=null,e=false;for(let i=start;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c===open)d++;else if(c===close){d--;if(d===0)return src.slice(start,i+1)}}throw new Error('UNBALANCED')}
          const marker='const schemas=';
          const p=src.indexOf(marker); if(p<0) throw new Error('SCHEMAS_NOT_FOUND');
          const objStart=src.indexOf('{',p); const obj=balanced(src,objStart,'{','}');
          const ctx={
            ENDPOINT:'https://docs.google.com/forms/d/e/',
            choice:(entry,title,choices,extra={})=>({entry,title,choices,required:true,...extra}),
            text:(entry,title,extra={})=>({entry,title,required:true,type:'text',...extra}),
            intensity:['Ausente','Leve','Moderada','Frequente','Muito frequente'],
            esteem:['Concordo inteiramente.','Concordo.','Discordo.','Discordo inteiramente']
          };
          const schemas=vm.runInNewContext('('+obj+')',ctx,{timeout:1000});
          const defs=[
            ['humor','FORM-2026-0015',2,21],
            ['ansiedade','FORM-2026-0016',3,14],
            ['autoestima','FORM-2026-0017',3,10]
          ];
          const formsHeader=['ID_INTERNO','CRIADO_EM','ATUALIZADO_EM','TITULO','DESCRICAO','TEMPLATE','STATUS','PUBLICAR','COLETAR_EMAIL','LIMITE_1_RESPOSTA','EDITAR_APOS_ENVIO','QUIZ','EMBARALHAR_PERGUNTAS','MENSAGEM_CONFIRMACAO','CRIAR_PLANILHA_RESPOSTAS','PASTA_FORM_ID','PASTA_RESPOSTAS_ID','GOOGLE_FORM_ID','URL_EDICAO','URL_RESPOSTA','RESPONSE_SHEET_ID','RESPONSE_SHEET_URL','ERRO_CODIGO','ERRO_MENSAGEM','LOCK_TOKEN','PROMPT_ORIGINAL'];
          const qHeader=['FORM_ID','ORDEM','SECAO','TIPO','TITULO','DESCRICAO','OBRIGATORIA','OPCOES_JSON','LINHAS_JSON','COLUNAS_JSON','ESCALA_MIN','ESCALA_MAX','ROTULO_MIN','ROTULO_MAX','RESPOSTAS_CORRETAS_JSON','PONTOS','FEEDBACK_CORRETO','FEEDBACK_INCORRETO','MOSTRAR_OUTRA_OPCAO','NAVEGACAO_JSON'];
          const forms=[formsHeader], qs=[qHeader], audit=[]; const now='2026-09-07T17:35:00-03:00';
          for(const [id,formId,skip,expected] of defs){
            const s=schemas[id]; if(!s) throw new Error('SCHEMA_MISSING:'+id);
            const clinical=s.fields.slice(skip); if(clinical.length!==expected) throw new Error(`${id}: expected ${expected}, got ${clinical.length}`);
            forms.push([formId,now,now,s.title,`Espelho canônico do monitoramento ${id}. Conteúdo clínico preservado literalmente da interface vigente.`,'CLINICO','RASCUNHO','FALSE','FALSE','FALSE','FALSE','FALSE','FALSE','Respostas registradas com sucesso. O material será processado e analisado pelo psicólogo responsável.','TRUE','','','','','','','','','','',`Fonte: assets/monitoramentos-v2.js; ${expected} itens clínicos; identificação padronizada.`]);
            let order=1;
            qs.push([formId,order++,'','TEXT','Nome completo','Identificação para vínculo clínico.','TRUE','','','','','','','','','','','','FALSE','']);
            qs.push([formId,order++,'','DATE','Data de nascimento','','TRUE','','','','','','','','','','','','FALSE','']);
            qs.push([formId,order++,'','DATE','Data de aplicação do rastreio','','TRUE','','','','','','','','','','','','FALSE','']);
            for(const f of clinical){
              const opts=(f.choices||[]).map(x=>typeof x==='object'?String(x.label??x.value):String(x));
              qs.push([formId,order++,'','MULTIPLE_CHOICE',f.title,'',f.required===false?'FALSE':'TRUE',JSON.stringify(opts),'','','','','','','','','','','FALSE','']);
            }
            audit.push({id,formId,clinicalCount:expected,totalItems:expected+3,status:'STAGED_RASCUNHO'});
          }
          const csv=rows=>rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}).join(',')).join('\n')+'\n';
          fs.mkdirSync('audits/forms-factory',{recursive:true});
          fs.writeFileSync('audits/forms-factory/monitoramentos-formularios.csv',csv(forms));
          fs.writeFileSync('audits/forms-factory/monitoramentos-perguntas.csv',csv(qs));
          fs.writeFileSync('audits/forms-factory/monitoramentos-stage.json',JSON.stringify({generatedAt:now,forms:audit,policy:{status:'RASCUNHO',published:false,clinicalContent:'PRESERVED'}},null,2)+'\n');
          console.log(JSON.stringify(audit,null,2));
          NODE
      - name: Gate expected counts and BDI-II preservation
        run: |
          node tests/bdi2-content-lock.test.mjs
          node - <<'NODE'
          const x=require('./audits/forms-factory/monitoramentos-stage.json');
          const exp={humor:24,ansiedade:17,autoestima:13};
          for(const f of x.forms) if(f.totalItems!==exp[f.id]) process.exit(1);
          console.log('MONITORING_FORMS_STAGE_PASS');
          NODE
      - name: Commit staging artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/forms-factory/monitoramentos-*.csv audits/forms-factory/monitoramentos-stage.json
          git commit -m 'Prepara espelhos canônicos de Humor Ansiedade e Autoestima'
          git push
