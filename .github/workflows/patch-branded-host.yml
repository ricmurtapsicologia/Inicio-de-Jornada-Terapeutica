name: Patch branded questionnaire hosts
on:
  push:
    branches: [fix/hidden-form-engine-20260906]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hidden-form-engine-20260906
      - name: Replace embedded external interfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'controle':('Formulário de Controle para Atendimento Clínico','controle','Abrir dados para atendimento'),
            'humor':('Avaliação de Humor','humor','Abrir Avaliação de Humor'),
            'autoestima':('Escala de Autoestima de Rosemberg','autoestima','Abrir Monitoramento de Autoestima'),
            'ansiedade':('Escala de Ansiedade','ansiedade','Abrir Monitoramento de Ansiedade'),
          }
          for key,(title,instrument,cta) in replacements.items():
            pattern=rf'<div class="form-detail" id="form-{key}">.*?</div>\s*</div>'
            new=f'''<div class="form-detail" id="form-{key}">
                    <h3>{title}</h3>
                    <p class="external-form-text">A aplicação ocorre em uma página clínica própria da Jornada Terapêutica, com interface consistente e foco no questionário.</p>
                    <div style="text-align:center;">
                        <a class="external-form-link" href="./monitoramento.html?instrument={instrument}">
                            {cta}
                        </a>
                    </div>
                </div>'''
            s,n=re.subn(pattern,new,s,count=1,flags=re.S)
            if n!=1:
              raise SystemExit(f'Falha ao localizar bloco canônico: {key} ({n})')
          s=s.replace('Para abrir formulários incorporados e enviar observações pelo WhatsApp, é necessário ativar o JavaScript no seu navegador.','Para abrir os questionários digitais e enviar observações pelo WhatsApp, é necessário ativar o JavaScript no seu navegador.')
          s=s.replace('Alguns questionários ajudam a organizar informações importantes e acompanhar sua evolução ao longo das sessões. Use os botões abaixo para escolher o instrumento desejado. Quando um formulário for selecionado, ele aparecerá logo abaixo desta grade. Clique novamente no mesmo botão para fechar o formulário.','Alguns questionários ajudam a organizar informações importantes e acompanhar sua evolução ao longo das sessões. Use os botões abaixo para escolher o instrumento desejado. Quando uma opção for selecionada, os detalhes e o acesso aparecerão logo abaixo desta grade.')
          p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: replace embedded Forms UI with branded hosts [skip ci]'
          git push origin HEAD:fix/hidden-form-engine-20260906
