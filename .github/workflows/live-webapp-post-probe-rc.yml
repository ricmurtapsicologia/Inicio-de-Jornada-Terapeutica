name: Live Web App POST probe RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/live-webapp-post-probe-rc.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe doPost without clinical payload
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbzrJuvVPBNPgMCZ-tmeCXy6LUMFBZB5vlNXSiP8aK3XBfiYh3xm4a4nq02xafnt65U/exec'
          BODY=$(mktemp)
          CODE=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -X POST -d '' -o "$BODY" -w '%{http_code}' "$URL")
          echo "HTTP=$CODE"
          test "$CODE" = "200"
          grep -q 'RM_SCREENING_SUBMIT_RESULT' "$BODY"
          grep -q 'PAYLOAD_MISSING' "$BODY"
          grep -q 'Não foi possível confirmar o registro' "$BODY"
          echo 'LIVE_WEBAPP_POST_PROBE_PASS'
