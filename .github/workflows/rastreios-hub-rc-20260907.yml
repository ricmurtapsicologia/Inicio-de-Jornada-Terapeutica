name: Rastreios Hub RC 2026-09-07

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths:
      - '.github/workflows/rastreios-hub-rc-20260907.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/**'
      - 'painel-rastreios/**'
      - 'monitoramento.html'
      - 'tests/**'
      - '.github/workflows/rastreios-hub-rc-20260907.yml'

permissions:
  contents: write

jobs:
  prepare-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Normalize BDI-II patient-facing identity and freeze current item block
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          js_path=Path('assets/monitoramentos-v2.js')
          hub_path=Path('painel-rastreios/index.html')
          root_path=Path('index.html')
          fixture_path=Path('tests/fixtures/bdi2-humor.sha256')
          test_path=Path('tests/bdi2-content-lock.test.mjs')

          js=js_path.read_text(encoding='utf-8')
          js=js.replace("title:'Avaliação de Humor'","title:'Humor e sintomas depressivos'")
          js_path.write_text(js,encoding='utf-8')

          hub=hub_path.read_text(encoding='utf-8')
          hub=hub.replace("name:'Como seu humor tem mudado nas últimas semanas',desc:'Acompanhamento longitudinal de mudanças no humor ao longo do tratamento.'","name:'Humor e sintomas depressivos nas últimas duas semanas',desc:'Aplicação clínica do BDI-II com conteúdo preservado e análise pelo psicólogo.'")
          hub_path.write_text(hub,encoding='utf-8')

          root=root_path.read_text(encoding='utf-8')
          root=root.replace('<h3>Avaliação de Humor</h3>','<h3>Humor e sintomas depressivos</h3>')
          root=root.replace('Abrir Avaliação de Humor','Abrir rastreio de humor')
          root_path.write_text(root,encoding='utf-8')

          current=js_path.read_text(encoding='utf-8')
          match=re.search(r"\n  humor:\{(.*?)\n  \},\n  ansiedade:\{",current,re.S)
          if not match:
            raise SystemExit('BDI2_HUMOR_SCHEMA_BLOCK_NOT_FOUND')
          block=match.group(1)
          count=len(re.findall(r"\bchoice\('",block))
          if count != 21:
            raise SystemExit(f'BDI2_QUESTION_COUNT_DRIFT:{count}')
          digest=hashlib.sha256(block.encode('utf-8')).hexdigest()
          fixture_path.parent.mkdir(parents=True,exist_ok=True)
          fixture_path.write_text(digest+'\n',encoding='utf-8')

          test_path.write_text('''import fs from 'node:fs';\nimport crypto from 'node:crypto';\nimport assert from 'node:assert/strict';\n\nconst source=fs.readFileSync('assets/monitoramentos-v2.js','utf8');\nconst match=source.match(/\\n  humor:\\{([\\s\\S]*?)\\n  \\},\\n  ansiedade:\\{/);\nassert.ok(match,'BDI-II humor schema block must exist');\nconst block=match[1];\nconst count=(block.match(/\\bchoice\\('/g)||[]).length;\nassert.equal(count,21,'BDI-II must preserve exactly 21 item groups');\nconst expected=fs.readFileSync('tests/fixtures/bdi2-humor.sha256','utf8').trim();\nconst actual=crypto.createHash('sha256').update(block,'utf8').digest('hex');\nassert.equal(actual,expected,'BDI-II questions/order/options changed: clinical review and explicit versioning required');\nassert.match(block,/Pensamentos ou desejos suicidas/,'BDI-II safety item must remain present');\nconsole.log('BDI2_CONTENT_LOCK_PASS');\n''',encoding='utf-8')
          PY

      - name: Run hub and bridge tests
        run: |
          node tests/branded-questionnaires.test.mjs
          node tests/validate-monitoring-bridge-v2.mjs
          node tests/validate-anamnese.mjs
          node tests/bdi2-content-lock.test.mjs

      - name: Hub inventory and Forms exposure gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          hub=Path('painel-rastreios/index.html').read_text(encoding='utf-8')
          urls=set(re.findall(r"url:'(https://ricmurtapsicologia\.github\.io/[^']+)'",hub))
          if len(urls)!=15:
            raise SystemExit(f'HUB_MUST_HAVE_15_UNIQUE_SCREENING_URLS:{len(urls)}')
          if re.search(r"docs\.google\.com/forms",hub,re.I):
            raise SystemExit('PUBLIC_HUB_EXPOSES_GOOGLE_FORMS')
          monitor=Path('monitoramento.html').read_text(encoding='utf-8')
          if re.search(r'<iframe[^>]+docs\.google\.com/forms',monitor,re.I):
            raise SystemExit('VISIBLE_GOOGLE_FORM_IFRAME_FORBIDDEN')
          PY

      - name: Commit RC normalization
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/monitoramentos-v2.js painel-rastreios/index.html index.html tests/fixtures/bdi2-humor.sha256 tests/bdi2-content-lock.test.mjs
          git commit -m 'Preserva BDI-II e normaliza entrada do hub'
          git push
