name: E2E final live · ICAPS only

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/e2e-icaps-final-live.yml']

permissions:
  contents: write

jobs:
  icaps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit synthetic ICAPS only
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbzrJuvVPBNPgMCZ-tmeCXy6LUMFBZB5vlNXSiP8aK3XBfiYh3xm4a4nq02xafnt65U/exec
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sid=`e2e-icaps-final-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const now=Date.now();
          const payload={
            version:'screening-bridge-v3.1',
            instrumentId:'icaps',
            submissionId:sid,
            startedAt:now-5000,
            submittedAt:now,
            identity:{name:'TESTE AUTOMATIZADO · NÃO É PACIENTE · ICAPS FINAL',birthDate:'2000-01-01',applicationDate:'2026-09-07'},
            responses:Array(60).fill(1)
          };
          (async()=>{
            const body=new URLSearchParams({payload:JSON.stringify(payload)});
            const res=await fetch(process.env.ENDPOINT,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body,redirect:'follow'});
            const html=await res.text();
            const clean=String(html).replace(/<[^>]+>/g,' ').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim().slice(0,1200);
            console.log('HTTP='+res.status);
            console.log('SID='+sid);
            console.log('BODY='+clean);
            const success=res.status===200&&html.includes(sid)&&html.includes('icaps')&&html.includes('processing')&&html.includes('complete');
            if(!success) throw new Error('ICAPS_LIVE_E2E_NOT_COMPLETE');
            const p='audits/e2e-live-progress.json';
            const progress=JSON.parse(fs.readFileSync(p,'utf8'));
            progress.instruments.icaps={status:'PASS',submissionId:sid,checkedAt:new Date().toISOString(),evidence:'final-live-after-scale-fix'};
            progress.updatedAt=new Date().toISOString();
            const ids=Object.keys(progress.instruments);
            progress.summary={
              pass:ids.filter(id=>progress.instruments[id]?.status==='PASS').length,
              waiting:ids.filter(id=>progress.instruments[id]?.status==='WAITING_FORM_PUBLICATION').length,
              pending:ids.filter(id=>progress.instruments[id]?.status==='PROCESSING_PENDING').length,
              fail:ids.filter(id=>progress.instruments[id]?.status==='FAIL').length
            };
            fs.writeFileSync(p,JSON.stringify(progress,null,2)+'\n');
            console.log('ICAPS_FINAL_LIVE_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit 15/15 ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/e2e-live-progress.json
          git commit -m 'Fecha ICAPS E2E vivo em 15 de 15'
          git push
