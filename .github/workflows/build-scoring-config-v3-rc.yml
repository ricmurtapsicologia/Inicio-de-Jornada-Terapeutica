name: Build scoring config v3 RC
on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/build-scoring-config-v3-rc.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Compile Esquemas mapping into Apps Script constant
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('audits/mirror-specs/esquemas.json').read_text(encoding='utf-8'))
          qs=[{'schemaId':q['schemaId'],'styleHint':q['styleHint']} for q in src['questions']]
          ids=[]
          for q in qs:
            if q['schemaId'] not in ids: ids.append(q['schemaId'])
          config={'schemas':[{'id':x,'nome':x} for x in ids],'questions':qs}
          payload=json.dumps(config,ensure_ascii=False,separators=(',',':'))
          out='/** Generated from canonical Esquemas source. Do not hand-edit. */\nconst SCREENING_SCHEMAS_CONFIG_V3 = Object.freeze('+payload+');\n'
          Path('apps-script/ScreeningScoringConfigV3.gs').write_text(out,encoding='utf-8')
          print('schemas',len(ids),'questions',len(qs))
          assert len(qs)==108
          assert len(ids)>=10
          PY
      - name: Commit generated config
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/ScreeningScoringConfigV3.gs
          git commit -m 'Compila mapeamento canônico de Esquemas para o scorer'
          git push
