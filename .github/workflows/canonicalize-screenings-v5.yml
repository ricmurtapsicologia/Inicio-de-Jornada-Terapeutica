name: Canonicalize screenings v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonicalize-screenings-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Curadoria fotográfica específica dos 15 rastreios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes
          get(){
            id="$1"; photo="$2";
            url="https://unsplash.com/photos/${photo}/download?force=true&w=1800"
            echo "hero $id <- $photo"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 -A 'Mozilla/5.0 RM-Clinical-Curation/5.0' "$url" -o "assets/heroes/${id}.jpg.tmp"
            test "$(wc -c < "assets/heroes/${id}.jpg.tmp")" -gt 30000
            file "assets/heroes/${id}.jpg.tmp" | grep -Eqi 'JPEG|PNG|WebP|image'
            mv "assets/heroes/${id}.jpg.tmp" "assets/heroes/${id}.jpg"
          }
          get geral VKnmszzzTig
          get tdah J7vp4RK-FPY
          get bipolar YKyyz4T3Rr4
          get borderline ndMmX66tWHQ
          get narcisismo 6oXtCQ3klIc
          get impulsividade jRKOG8ZJLI0
          get esquemas JXyY3jRV9oI
          get modos VrCf2Kv2ixE
          get necessidades ho3E9RiZRWw
          get codependencia M1IDH7G6Lqk
          get icaps WexSW1s6XaE
          get risco wYxHJr_9OVw
          # humor/BDI-II: preservado; usuário aprovou a imagem vigente.
          test -s assets/heroes/humor.jpg
          get ansiedade oPRd3ID4aUw
          get autoestima AofgbZrFyGA

      - name: Aplicar naming, scoring, relatório, hero e auditoria
        run: python3 tools/canonicalize_screenings_v5.py

      - name: Rebuild do bundle Apps Script no branch canônico
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names=['ScreeningBridgeV3.gs','ScreeningOrderedRecordsV31.gs','ScreeningScoringConfigV3.gs','ScreeningScoringV3.gs','ScreeningReportV3.gs','ScreeningPipelineV3.gs','ScreeningIntegrationsV3.gs','ScreeningOrchestratorV3.gs','ScreeningSetupV3.gs']
          parts=['/**\n * ScreeningBackendV31.bundle.gs\n * ARQUIVO GERADO. Não editar manualmente.\n * Bundle único do backend clínico dos 15 rastreios.\n */\n']
          for name in names:
              p=Path('apps-script')/name
              if not p.exists(): raise SystemExit('missing '+name)
              parts += [f'\n/* ===== {name} ===== */\n',p.read_text(encoding='utf-8').rstrip()+'\n']
          Path('apps-script/ScreeningBackendV31.bundle.gs').write_text(''.join(parts),encoding='utf-8')
          PY
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['assets/screening-visual-v4.js','assets/screening-uniformity-v1.js','assets/screening-catalog-v3.js']) new Function(fs.readFileSync(p,'utf8'));
          const b=fs.readFileSync('apps-script/ScreeningBackendV31.bundle.gs','utf8');
          new Function(b);
          if(!b.includes("const SCREENING_SCORING_VERSION = '3.1.0'")) throw new Error('scoring version');
          if(!b.includes('SCREENING_EVIDENCE_V5')) throw new Error('evidence map');
          if(!b.includes('Avaliação clínica contextual obrigatória')) throw new Error('risk hardening');
          if(/const cuts=\[118,141,161,176\]/.test(b)) throw new Error('borderline provisional cuts residue');
          console.log('STATIC_JS_APPS_SCRIPT_PASS');
          NODE

      - name: Gate canônico v5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, hashlib, re
          root=pathlib.Path('.')
          a=json.loads((root/'audits/canonical-screening-v5.json').read_text(encoding='utf-8'))
          assert a['globalGates']['heroCount']==15
          assert a['globalGates']['uniqueHeroHashes']==15
          assert a['globalGates']['nameCount']==15
          assert a['globalGates']['noLegacySvgGenerator'] is True
          cfg=json.loads((root/'assets/screening-public-experience-v2.json').read_text(encoding='utf-8'))
          cat=(root/'assets/screening-catalog-v3.js').read_text(encoding='utf-8')
          vis=(root/'assets/screening-visual-v4.js').read_text(encoding='utf-8')
          score=(root/'apps-script/ScreeningScoringV3.gs').read_text(encoding='utf-8')
          assert 'v=5.0.0' in vis
          assert 'HERO_SCENES' not in (root/'assets/screening-system-v2.js').read_text(encoding='utf-8')
          assert 'Sem risco' not in score
          assert 'faixas clinician-rated automáticas' in score
          for h in a['heroes']:
              assert cfg['instruments'][h['id']]['publicName']==h['name']
              assert (root/h['file']).stat().st_size>30000
          print('CANONICAL_SCREENING_V5_PASS')
          PY

      - name: Commit final canônico
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/canonicalize-screenings-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(rastreios): consolida heroes, naming, scoring e relatórios clínicos v5'
          git push
