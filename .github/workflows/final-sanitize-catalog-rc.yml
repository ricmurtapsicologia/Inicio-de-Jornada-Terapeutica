name: Final sanitize catalog and backend RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths:
      - '.github/workflows/final-sanitize-catalog-rc.yml'
      - 'tools/final_sanitize_catalog_backend.py'
      - 'tests/branded-questionnaires.test.mjs'
      - 'tests/validate-anamnese.mjs'
      - 'tests/screening-pipeline-v3-static.test.mjs'
      - 'tests/screening-report-integrations-v3-static.test.mjs'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final sanitation
        run: python3 tools/final_sanitize_catalog_backend.py
      - name: Static gates
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const catSrc=fs.readFileSync('assets/screening-catalog-v3.js','utf8');
          const sandbox={window:{}};vm.runInNewContext(catSrc,sandbox,{timeout:1000});
          const c=sandbox.window.RM_SCREENING_CATALOG;
          if(!c||c.items.length!==15)throw new Error('CATALOG_NOT_15');
          if(new Set(c.items.map(x=>x.id)).size!==15)throw new Error('CATALOG_ID_DUP');
          if(new Set(c.items.map(x=>x.url)).size!==15)throw new Error('CATALOG_URL_DUP');
          const required=['geral','tdah','bipolar','borderline','narcisismo','impulsividade','esquemas','modos','necessidades','codependencia','icaps','risco','humor','ansiedade','autoestima'];
          for(const id of required)if(!c.items.some(x=>x.id===id))throw new Error('CATALOG_MISSING_'+id);
          const journey=fs.readFileSync('index.html','utf8'),panel=fs.readFileSync('painel-rastreios/index.html','utf8');
          if(!journey.includes('screening-catalog-v3.js')||!panel.includes('screening-catalog-v3.js'))throw new Error('CATALOG_NOT_SHARED');
          if(/forms\.google\.com[^'\"\s]*viewform/i.test(journey)||/<iframe[^>]+forms\.google/i.test(journey))throw new Error('VISIBLE_FORM_IN_JOURNEY');
          if(/const ITEMS=\[\s*\{/s.test(panel))throw new Error('PANEL_INLINE_CATALOG_RESIDUE');
          const pipe=fs.readFileSync('apps-script/ScreeningPipelineV3.gs','utf8'),integ=fs.readFileSync('apps-script/ScreeningIntegrationsV3.gs','utf8'),setup=fs.readFileSync('apps-script/ScreeningSetupV3.gs','utf8');
          const activePipe=pipe.replace(/const SCREENING_PIPELINE_LEGACY_HEADERS[^;]+;/,'');
          for(const src of [activePipe,integ]){
            if(/TRELLO_|appendScreeningTrello|TRELLO_UPDATED/.test(src))throw new Error('ACTIVE_TRELLO_BACKEND_RESIDUE');
            if(/GPS_URL|GPS_WEBHOOK/.test(src))throw new Error('GPS_BACKEND_RESIDUE');
          }
          if(!pipe.includes("'EMAIL_SENT','COMPLETE'"))throw new Error('PIPELINE_FINAL_STATE_DRIFT');
          if(!setup.includes('props.deleteProperty(k)'))throw new Error('LEGACY_PROPERTY_CLEANUP_MISSING');
          console.log('FINAL_SANITATION_STATIC_PASS');
          NODE
      - name: Existing regression gates
        run: |
          set -e
          node tests/bdi2-content-lock.test.mjs
          node tests/branded-questionnaires.test.mjs
          node tests/hero-variants.test.mjs
          node tests/validate-monitoring-bridge-v2.mjs
          node tests/validate-anamnese.mjs
          node tests/ordered-transport-v31.test.mjs
          node tests/screening-bridge-v3-static.test.mjs
          node tests/screening-postprocessing-v3-static.test.mjs
          node tests/screening-pipeline-v3-static.test.mjs
          node tests/screening-report-integrations-v3-static.test.mjs
          node tests/screening-scoring-v3-static.test.mjs
          node tests/screening-scoring-v3-runtime.test.mjs
      - name: Commit sanitized architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screening-catalog-v3.js index.html painel-rastreios/index.html apps-script/ScreeningIntegrationsV3.gs apps-script/ScreeningPipelineV3.gs apps-script/ScreeningSetupV3.gs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Saneia pipeline e unifica catálogo canônico 15/15'
          git push
