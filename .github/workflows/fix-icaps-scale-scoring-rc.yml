name: Fix ICAPS scale scoring RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/fix-icaps-scale-scoring-rc.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Patch ICAPS SCALE scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/ScreeningScoringV3.gs')
          s=p.read_text(encoding='utf-8')
          old="const vals=r.slice(d*10,d*10+10).map(function(x){return scIdx_(x)*25;});"
          new="const vals=r.slice(d*10,d*10+10).map(function(x){return (scNum_(x,1,5)-1)*25;});"
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('ICAPS_SCORING_PATTERN_NOT_FOUND')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node tests/scoring-v3.test.mjs
      - name: Commit fix
        run: |
          if [ -z "$(git status --porcelain -- apps-script/ScreeningScoringV3.gs)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/ScreeningScoringV3.gs
          git commit -m 'Corrige ICAPS SCALE 1-5 no scoring v3'
          git push
