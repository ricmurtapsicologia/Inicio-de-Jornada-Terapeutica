name: E2E live resumable · 15 rastreios

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/e2e-live-resumable-15.yml']

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run resumable synthetic E2E
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbzrJuvVPBNPgMCZ-tmeCXy6LUMFBZB5vlNXSiP8aK3XBfiYh3xm4a4nq02xafnt65U/exec
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ids=['geral','tdah','bipolar','borderline','narcisismo','impulsividade','esquemas','modos','necessidades','codependencia','icaps','risco','humor','ansiedade','autoestima'];
          const progressPath='audits/e2e-live-progress.json';
          fs.mkdirSync('audits',{recursive:true});
          let progress=fs.existsSync(progressPath)?JSON.parse(fs.readFileSync(progressPath,'utf8')):{version:1,instruments:{}};
          if(!progress.instruments.autoestima)progress.instruments.autoestima={status:'PASS',evidence:'pilot-verified',submissionId:'e2e-autoestima-34172376185-1'};

          function balanced(src,start,open,close){let d=0,q=null,e=false;for(let i=start;i<src.length;i++){const c=src[i];if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c===open)d++;else if(c===close){d--;if(d===0)return src.slice(start,i+1)}}throw new Error('UNBALANCED')}
          function monitoringSchemas(){
            const src=fs.readFileSync('assets/monitoramentos-v2.js','utf8');
            const p=src.indexOf('const schemas=');if(p<0)throw new Error('MONITOR_SCHEMAS_MISSING');
            const start=src.indexOf('{',p),obj=balanced(src,start,'{','}');
            const code=`(()=>{const ENDPOINT='https://docs.google.com/forms/d/e/';const choice=(entry,title,choices,extra={})=>({entry,title,choices,required:true,...extra});const text=(entry,title,extra={})=>({entry,title,required:true,type:'text',...extra});const intensity=['Ausente','Leve','Moderada','Frequente','Muito frequente'];const esteem=['Concordo inteiramente.','Concordo.','Discordo.','Discordo inteiramente'];const schemas=${obj};return schemas;})()`;
            return vm.runInNewContext(code,Object.create(null),{timeout:1000});
          }
          const mons=monitoringSchemas();
          const monResponses={};
          for(const id of ['humor','ansiedade','autoestima'])monResponses[id]=mons[id].fields.filter(f=>Array.isArray(f.choices)).map(f=>String(typeof f.choices[0]==='object'?f.choices[0].value:f.choices[0]));
          if(monResponses.humor.length!==21||monResponses.ansiedade.length!==14||monResponses.autoestima.length!==10)throw new Error('MONITOR_COUNTS_DRIFT');

          function safePick(id,q){
            const opts=(q.options||[]).map(o=>String(o.label??o.value??'')).filter(v=>v.trim()&&!/^selecione(?:\.\.\.)?$/i.test(v.trim()));
            const find=re=>opts.find(v=>re.test(v));
            let v;
            if(id==='bipolar')v=find(/^não se aplica$/i)||find(/^nenhum$/i)||find(/^nada\b/i)||find(/<\s*2\s*dias/i);
            else if(id==='narcisismo')v=find(/^não$/i);
            else if(id==='risco')v=find(/^0$/);
            else if(id==='codependencia')v=find(/discordo totalmente/i);
            if(!v)v=opts[0];
            if(v!==undefined){if(/checkbox/i.test(String(q.type||'')))return [v];return v;}
            if(/scale/i.test(String(q.type||'')))return Number(q.scaleMin||q.min||1);
            if(/date/i.test(String(q.type||'')))return '2026-09-07';
            return '1';
          }
          function responsesFor(id){
            if(id==='icaps')return Array(60).fill(1);
            if(monResponses[id])return monResponses[id];
            const spec=JSON.parse(fs.readFileSync(`audits/mirror-specs/${id}.json`,'utf8'));
            return spec.questions.map(q=>safePick(id,q));
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function submit(id){
            const now=Date.now(),sid=`e2e-${id}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const payload={version:'screening-bridge-v3.1',instrumentId:id,submissionId:sid,startedAt:now-5000,submittedAt:now,identity:{name:`TESTE AUTOMATIZADO · NÃO É PACIENTE · ${id.toUpperCase()}`,birthDate:'2000-01-01',applicationDate:'2026-09-07'},responses:responsesFor(id)};
            const body=new URLSearchParams({payload:JSON.stringify(payload)});
            const res=await fetch(process.env.ENDPOINT,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body,redirect:'follow'});
            const html=await res.text();
            const success=res.status===200&&html.includes(sid)&&html.includes(id)&&html.includes('processing')&&html.includes('complete');
            const waiting=/form is not accepting responses/i.test(html);
            const pending=res.status===200&&html.includes(sid)&&html.includes('processing')&&html.includes('pending');
            return {id,sid,httpStatus:res.status,success,waiting,pending};
          }
          (async()=>{
            const results=[];let blocking=0;
            for(const id of ids){
              const prior=progress.instruments[id]?.status;
              // A resposta PROCESSING_PENDING já foi persistida. Não duplicar; retestar só após deploy da correção.
              if(prior==='PASS'||prior==='PROCESSING_PENDING'||String(prior||'').startsWith('BLOCKED_'))continue;
              const r=await submit(id);results.push(r);
              if(r.success)progress.instruments[id]={status:'PASS',submissionId:r.sid,checkedAt:new Date().toISOString()};
              else if(r.waiting)progress.instruments[id]={status:'WAITING_FORM_PUBLICATION',checkedAt:new Date().toISOString()};
              else if(r.pending){progress.instruments[id]={status:'PROCESSING_PENDING',submissionId:r.sid,checkedAt:new Date().toISOString()};blocking++;}
              else {progress.instruments[id]={status:'FAIL',submissionId:r.sid,httpStatus:r.httpStatus,checkedAt:new Date().toISOString()};blocking++;}
              await sleep(1200);
            }
            progress.updatedAt=new Date().toISOString();
            progress.summary={pass:ids.filter(id=>progress.instruments[id]?.status==='PASS').length,waiting:ids.filter(id=>progress.instruments[id]?.status==='WAITING_FORM_PUBLICATION').length,pending:ids.filter(id=>progress.instruments[id]?.status==='PROCESSING_PENDING').length,fail:ids.filter(id=>progress.instruments[id]?.status==='FAIL').length};
            fs.writeFileSync(progressPath,JSON.stringify(progress,null,2)+'\n');
            console.log(JSON.stringify({results,summary:progress.summary},null,2));
            fs.writeFileSync('/tmp/e2e-blocking',String(blocking));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit progress ledger
        if: always()
        run: |
          if [ -f audits/e2e-live-progress.json ] && [ -n "$(git status --porcelain -- audits/e2e-live-progress.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add audits/e2e-live-progress.json
            git commit -m 'Atualiza progresso E2E vivo dos rastreios'
            git push
          fi
      - name: Gate blocking failures
        if: always()
        run: |
          B=$(cat /tmp/e2e-blocking 2>/dev/null || echo 1)
          test "$B" = "0"
