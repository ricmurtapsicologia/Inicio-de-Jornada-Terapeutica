name: Scoring source inventory RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/scoring-source-inventory-rc.yml']

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Scan current sources and recent history
        run: |
          set -euo pipefail
          mkdir -p audits/scoring-sources /tmp/scoring-repos
          cat > /tmp/inventory.py <<'PY'
          import json, os, re, subprocess, pathlib

          repos={
            'geral':'Rastreioclinico','tdah':'rastreioTDAH','bipolar':'tab-bateria-integrada',
            'borderline':'Inventario-de-Tracos-Borderline','narcisismo':'bateria.narcisismo',
            'impulsividade':'Rastreio-de-Impulsividade','esquemas':'rastreio.de.esquemas',
            'modos':'rastreiomodosesquematicos','necessidades':'Escala-de-Necessidades-Emocionais',
            'codependencia':'Escala-de-Co-Depenpencia-Emocional','icaps':'ICAPS','risco':'TriagemRiscoSuicidio'
          }
          current_rx=re.compile(r'(?i)(calculate.?score|score\s*[=:]|total.?score|pontua[cç][aã]o|escore|cut.?off|ponto.?de.?corte|classifica[cç][aã]o|subescala|subscale|reverse|invert|interpret|severity|gravidade|resultado)')
          strong_rx=re.compile(r'(?i)(calculate.?score|total.?score|pontua[cç][aã]o|escore|cut.?off|ponto.?de.?corte|classifica[cç][aã]o|subescala|subscale|reverse|invert|severity)')
          allowed={'.html','.js','.mjs','.ts','.json','.md','.yml','.yaml','.gs'}
          out={'generatedAt':'2026-09-07','policy':'Use only pre-existing scoring rules; never invent psychometric rules.','instruments':{}}
          base=pathlib.Path('/tmp/scoring-repos')
          for iid,repo in repos.items():
            dest=base/repo
            subprocess.run(['git','clone','--quiet','--depth','80',f'https://github.com/ricmurtapsicologia/{repo}.git',str(dest)],check=True)
            matches=[]
            for p in dest.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed or '.git' in p.parts: continue
              try: txt=p.read_text(encoding='utf-8',errors='ignore')
              except: continue
              lines=[]
              for n,line in enumerate(txt.splitlines(),1):
                if current_rx.search(line):
                  lines.append({'line':n,'text':line.strip()[:500],'strong':bool(strong_rx.search(line))})
              if lines: matches.append({'path':str(p.relative_to(dest)),'matches':lines[:40]})
            hist=subprocess.run(['git','-C',str(dest),'log','--all','--oneline','-G','calculateScore|totalScore|pontua|escore|cut.?off|classifica|subescala|reverse|invert','-n','30'],capture_output=True,text=True).stdout.strip().splitlines()
            strong=sum(1 for f in matches for m in f['matches'] if m['strong'])
            status='CURRENT_RULES_FOUND' if strong else ('HISTORICAL_RULES_FOUND' if hist else 'NO_RULES_FOUND')
            out['instruments'][iid]={'repo':repo,'status':status,'currentStrongMatches':strong,'currentFiles':matches[:25],'historyCandidates':hist[:30]}
          # monitoramentos: current source belongs to this hub
          mon=pathlib.Path('assets/monitoramentos-v2.js').read_text(encoding='utf-8',errors='ignore')
          for iid in ['humor','ansiedade','autoestima']:
            marker=re.search(rf'\n\s*{iid}:\{{',mon)
            start=marker.start() if marker else -1
            nxt=min([x for x in [mon.find('\n  humor:{',start+1),mon.find('\n  ansiedade:{',start+1),mon.find('\n  autoestima:{',start+1)] if x>start] or [len(mon)])
            block=mon[start:nxt] if start>=0 else ''
            lines=[{'line':n+1,'text':l.strip()[:500],'strong':bool(strong_rx.search(l))} for n,l in enumerate(block.splitlines()) if current_rx.search(l)]
            strong=sum(1 for x in lines if x['strong'])
            out['instruments'][iid]={'repo':'Inicio-de-Jornada-Terapeutica','source':'assets/monitoramentos-v2.js','status':'CURRENT_RULES_FOUND' if strong else 'NO_RULES_FOUND','currentStrongMatches':strong,'currentFiles':[{'path':'assets/monitoramentos-v2.js','matches':lines[:60]}] if lines else [],'historyCandidates':[]}
          pathlib.Path('audits/scoring-sources/scoring-source-inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          summary={k:{'status':v['status'],'strong':v.get('currentStrongMatches',0),'history':len(v.get('historyCandidates',[]))} for k,v in out['instruments'].items()}
          pathlib.Path('audits/scoring-sources/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/inventory.py
      - name: Commit scoring inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/scoring-sources
          git commit -m 'Mapeia fontes existentes de scoring dos 15 rastreios'
          git push
