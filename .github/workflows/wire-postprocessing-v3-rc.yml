name: Wire post-processing v3 RC
on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/wire-postprocessing-v3-rc.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Wire bridge after confirmed submit and add urgent subject
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/ScreeningBridgeV3.gs')
          s=p.read_text(encoding='utf-8')
          old="""    // Recibo somente após confirmação do Google Forms.\n    formResponse.submit();\n    cache.put(cacheKey, '1', SCREENING_BRIDGE.CACHE_TTL_SECONDS);\n\n    return screeningBridgeHtml_({\n      ok: true,\n      submissionId: payload.submissionId,\n      instrumentId: payload.instrumentId\n    });"""
          new="""    // Persistência é o gate primário: nunca depender de scoring/e-mail/Trello.\n    const submittedResponse = formResponse.submit();\n    cache.put(cacheKey, '1', SCREENING_BRIDGE.CACHE_TTL_SECONDS);\n\n    let processing = 'complete';\n    try {\n      const formResponseId = String((submittedResponse && submittedResponse.getId && submittedResponse.getId()) || payload.submissionId);\n      runScreeningPostProcessingV3_({ form: form, payload: payload, formResponseId: formResponseId });\n    } catch (postErr) {\n      // A resposta JÁ está persistida; não induzir reenvio/duplicidade.\n      processing = 'pending';\n      console.error('ScreeningPostProcess:' + screeningSafePostProcessError_(postErr));\n    }\n\n    return screeningBridgeHtml_({\n      ok: true,\n      submissionId: payload.submissionId,\n      instrumentId: payload.instrumentId,\n      processing: processing\n    });"""
          if old not in s: raise SystemExit('BRIDGE_WIRE_TARGET_NOT_FOUND')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          rp=Path('apps-script/ScreeningReportV3.gs')
          r=rp.read_text(encoding='utf-8')
          old2="const subject = ['RASTREIO', instrumentName, patientName, dateForSubject].join(' · ').slice(0, 240);"
          new2="const subject = [result.urgent === true ? 'ALERTA CLÍNICO' : 'RASTREIO', instrumentName, patientName, dateForSubject].join(' · ').slice(0, 240);"
          if old2 not in r: raise SystemExit('REPORT_SUBJECT_TARGET_NOT_FOUND')
          rp.write_text(r.replace(old2,new2,1),encoding='utf-8')

          sp=Path('apps-script/ScreeningScoringV3.gs')
          ss=sp.read_text(encoding='utf-8')
          old3="if(cls==='Risco moderado'||cls==='Risco grave')flags.push('CLINICAL_ALERT_REQUIRED');"
          new3="if(['A1','A2','A3','A4'].some(function(k){return resp[k]>=1;}))flags.push('SUICIDAL_IDEATION_PRESENT');\n  if(cls==='Risco moderado'||cls==='Risco grave')flags.push('CLINICAL_ALERT_REQUIRED');"
          if old3 not in ss: raise SystemExit('RISK_FLAG_TARGET_NOT_FOUND')
          sp.write_text(ss.replace(old3,new3,1),encoding='utf-8')
          PY
          cat > tests/screening-postprocessing-v3-static.test.mjs <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const bridge=fs.readFileSync('apps-script/ScreeningBridgeV3.gs','utf8');
          const orch=fs.readFileSync('apps-script/ScreeningOrchestratorV3.gs','utf8');
          const report=fs.readFileSync('apps-script/ScreeningReportV3.gs','utf8');
          const score=fs.readFileSync('apps-script/ScreeningScoringV3.gs','utf8');
          const submitPos=bridge.indexOf('formResponse.submit()');
          const postPos=bridge.indexOf('runScreeningPostProcessingV3_');
          assert.ok(submitPos>=0 && postPos>submitPos,'pós-processamento deve ocorrer somente após submit confirmado');
          assert.match(bridge,/processing = 'pending'/);
          assert.match(bridge,/ok: true,[\s\S]*processing: processing/,'falha pós-submit não pode virar falha de persistência');
          assert.match(orch,/scoreScreeningV3_/);
          assert.match(orch,/enqueueScreeningPipeline_/);
          assert.match(orch,/SUICIDE_ITEM_ENDORSED/);
          assert.match(report,/ALERTA CLÍNICO/);
          assert.match(score,/SUICIDAL_IDEATION_PRESENT/);
          console.log('SCREENING_POSTPROCESSING_V3_STATIC_PASS');
          NODE
      - name: Run v3 gates
        run: |
          node tests/screening-scoring-v3-static.test.mjs
          node tests/screening-postprocessing-v3-static.test.mjs
          node tests/screening-bridge-v3-static.test.mjs
          node tests/screening-report-integrations-v3-static.test.mjs
          node tests/screening-pipeline-v3-static.test.mjs
          node tests/bdi2-content-lock.test.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/ScreeningBridgeV3.gs apps-script/ScreeningReportV3.gs apps-script/ScreeningScoringV3.gs tests/screening-postprocessing-v3-static.test.mjs
          git commit -m 'Liga scoring e relatório após persistência confirmada'
          git push
