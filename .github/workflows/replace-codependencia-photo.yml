name: Trocar foto codependência

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-codependencia-photo.yml

permissions:
  contents: write

jobs:
  replace-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Substituir ilustração vetorial por fotografia orgânica
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<article class="service"[^>]*aria-label="Dependência e codependência emocional.*?<img\s+)src="[^"]+"\s+alt="[^"]+"', re.S)
          replacement = r'\1src="https://images.unsplash.com/photo-1645476074517-c9ca9c8ef129?auto=format&fit=crop&w=1200&h=788&q=82" alt="Duas pessoas de mãos dadas, representando vínculo, conexão e autonomia emocional"'
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Card de dependência/codependência não localizado para troca da imagem.')
          if 'data:image/svg+xml;base64,' in re.search(r'<article class="service"[^>]*aria-label="Dependência e codependência emocional.*?</article>', s2, re.S).group(0):
              raise SystemExit('A imagem vetorial ainda está presente no card.')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Substitui imagem vetorial por foto orgânica em codependência"
          git push
