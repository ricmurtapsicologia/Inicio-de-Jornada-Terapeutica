name: Visual browser audit 15 RC

on:
  push:
    branches:
      - rastreios-visual-identity-20260908
    paths:
      - '.github/workflows/visual-browser-audit-rc.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-visual-identity-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refine identity matching
        run: python3 tools/refine_identity_match.py
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Audit live DOMs using RC runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const js=fs.readFileSync('assets/screening-system-v2.js','utf8');
          const css=fs.readFileSync('assets/screening-system-v2.css','utf8');
          const cases=[
            ['geral','https://ricmurtapsicologia.github.io/Rastreioclinico/'],
            ['tdah','https://ricmurtapsicologia.github.io/rastreioTDAH/'],
            ['bipolar','https://ricmurtapsicologia.github.io/tab-bateria-integrada/'],
            ['borderline','https://ricmurtapsicologia.github.io/Inventario-de-Tracos-Borderline/'],
            ['narcisismo','https://ricmurtapsicologia.github.io/bateria.narcisismo/'],
            ['impulsividade','https://ricmurtapsicologia.github.io/Rastreio-de-Impulsividade/'],
            ['esquemas','https://ricmurtapsicologia.github.io/rastreio.de.esquemas/'],
            ['modos','https://ricmurtapsicologia.github.io/rastreiomodosesquematicos/'],
            ['necessidades','https://ricmurtapsicologia.github.io/Escala-de-Necessidades-Emocionais/'],
            ['codependencia','https://ricmurtapsicologia.github.io/Escala-de-Co-Depenpencia-Emocional/'],
            ['icaps','https://ricmurtapsicologia.github.io/ICAPS/'],
            ['risco','https://ricmurtapsicologia.github.io/TriagemRiscoSuicidio/'],
            ['humor','https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/monitoramento.html?instrument=humor'],
            ['ansiedade','https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/monitoramento.html?instrument=ansiedade'],
            ['autoestima','https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/monitoramento.html?instrument=autoestima']
          ];
          const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!el.hidden};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const heroSources=[];
            const summary=[];
            for(const [id,url] of cases){
              const context=await browser.newContext({viewport:{width:1440,height:1100}});
              await context.route(/screening-system-v2\.js(?:\?.*)?$/,r=>r.fulfill({status:200,contentType:'application/javascript; charset=utf-8',body:js}));
              await context.route(/screening-system-v2\.css(?:\?.*)?$/,r=>r.fulfill({status:200,contentType:'text/css; charset=utf-8',body:css}));
              const page=await context.newPage();
              const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('.rm-screening-shell',{timeout:30000});
              await page.waitForSelector('.rm-identity',{timeout:30000});
              await page.waitForTimeout(600);
              const state=await page.evaluate((id)=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!el.hidden};
                const canon=[...document.querySelectorAll('.rm-identity input')].filter(visible);
                const legacy=[...document.querySelectorAll('input,select,textarea')].filter(el=>!el.closest('.rm-identity')&&visible(el)).filter(el=>{
                  const lab=el.id?document.querySelector(`label[for="${CSS.escape(el.id)}"]`)?.textContent||'':'';
                  const t=[lab,el.getAttribute('aria-label'),el.getAttribute('placeholder'),el.name,el.id,el.closest('label')?.textContent].filter(Boolean).join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
                  return /nome\s+completo|full\s*name|patient\s*name|nome\s+do\s+paciente|data\s+de\s+nascimento|birth\s*date|nascimento|data\s+de\s+aplicacao|application\s*date|response\s*date|(^|\b)idade(\b|$)|(^|\b)age(\b|$)/.test(t)||/^(paciente|patientname|fullname|nome|name)$/i.test(String(el.id||''));
                });
                const hero=document.querySelector('.rm-screening-visual img');
                const shell=document.querySelector('.rm-screening-shell');
                const heroBox=document.querySelector('.rm-screening-hero');
                return {id,canonical:canon.length,legacy:legacy.length,heroSrc:hero?.src||'',heroAlt:hero?.alt||'',shells:document.querySelectorAll('.rm-screening-shell').length,identities:document.querySelectorAll('.rm-identity').length,heroDisplay:getComputedStyle(heroBox).display,shellWidth:shell?.getBoundingClientRect().width||0};
              },id);
              if(state.shells!==1)throw new Error(`${id}: shell ${state.shells}`);
              if(state.identities!==1)throw new Error(`${id}: identity ${state.identities}`);
              if(state.canonical!==3)throw new Error(`${id}: canonical visible identity controls ${state.canonical}`);
              if(state.legacy!==0)throw new Error(`${id}: visible legacy identity controls ${state.legacy}`);
              if(!state.heroSrc.startsWith('data:image/svg+xml'))throw new Error(`${id}: hero source not RC artwork`);
              if(!state.heroAlt)throw new Error(`${id}: missing hero alt`);
              if(state.heroDisplay!=='grid')throw new Error(`${id}: hero layout ${state.heroDisplay}`);
              if(state.shellWidth<800)throw new Error(`${id}: unexpected desktop shell width ${state.shellWidth}`);
              if(pageErrors.some(x=>/screening|identity|hero/i.test(x)))throw new Error(`${id}: ${pageErrors.join(' | ')}`);
              heroSources.push(state.heroSrc);summary.push({id,canonical:state.canonical,legacy:state.legacy,heroAlt:state.heroAlt});
              await context.close();
            }
            if(new Set(heroSources).size!==15)throw new Error(`unique hero images ${new Set(heroSources).size}/15`);
            fs.writeFileSync('audits/visual-identity-15-20260908.json',JSON.stringify({status:'PASS',total:15,uniqueHeroes:15,summary},null,2));
            console.log('VISUAL_BROWSER_15_PASS · 15 banners · 15 unique images · 1 identity block/page · 0 visible legacy identity fields');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit refinement and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screening-system-v2.js audits/visual-identity-15-20260908.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Valida banner e identificação nos 15 rastreios reais'
          git push
