name: E2E live · Autoestima

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/e2e-autoestima-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-autoestima:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit synthetic Autoestima screening
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbzrJuvVPBNPgMCZ-tmeCXy6LUMFBZB5vlNXSiP8aK3XBfiYh3xm4a4nq02xafnt65U/exec
        run: |
          set -u
          NOW=$(date +%s%3N)
          START=$((NOW-5000))
          SID="e2e-autoestima-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PAYLOAD=$(python3 - <<PY
          import json
          print(json.dumps({
            "version":"screening-bridge-v3.1",
            "instrumentId":"autoestima",
            "submissionId":"$SID",
            "startedAt":$START,
            "submittedAt":$NOW,
            "identity":{
              "name":"TESTE AUTOMATIZADO · NÃO É PACIENTE",
              "birthDate":"2000-01-01",
              "applicationDate":"2026-09-07"
            },
            "responses":["Concordo."]*10
          }, ensure_ascii=False))
          PY
          )
          CODE=$(curl -sS -L -o /tmp/response.html -w '%{http_code}' --data-urlencode "payload=$PAYLOAD" "$ENDPOINT")
          echo "http_code=$CODE"
          echo "submission_id=$SID"
          cat /tmp/response.html
          echo
          test "$CODE" = "200"
          grep -q '"ok":true' /tmp/response.html
          grep -q '"instrumentId":"autoestima"' /tmp/response.html
          if grep -q '"processing":"complete"' /tmp/response.html; then
            echo 'processing=complete'
          elif grep -q '"processing":"pending"' /tmp/response.html; then
            echo 'processing=pending'
          else
            echo 'processing=unknown'
            exit 1
          fi
# rerun after Forms Factory publication of Autoestima
