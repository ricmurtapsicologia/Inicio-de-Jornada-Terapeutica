name: Jornada Terapêutica — revisão final cinco áreas

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jornada-five-areas-v2.yml

permissions:
  contents: write

jobs:
  revise-audit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar cinco áreas, auditar 3 ciclos e executar smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import quote
          import base64
          import re
          import sys

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('grid-template-columns: repeat(4, minmax(0, 1fr));','grid-template-columns: repeat(5, minmax(0, 1fr));',1)
          text = text.replace('<h2 id="sec-servicos" class="section-title">Nossos Serviços Terapêuticos</h2>','<h2 id="sec-servicos" class="section-title">Áreas de Atuação</h2>',1)

          subtitle_pattern = re.compile(r'(<h2 id="sec-servicos" class="section-title">Áreas de Atuação</h2>\s*<p class="section-subtitle">).*?(</p>)', re.S)
          subtitle = '\n                Cinco frentes de cuidado, com objetivos e métodos distintos. Os atendimentos são realizados exclusivamente <strong>online</strong>, em ambiente seguro e sigiloso, com definição clara de objetivos e encaminhamento quando indicado. Clique nos cards para conhecer cada área.\n            '
          text, n = subtitle_pattern.subn(r'\1' + subtitle + r'\2', text, count=1)
          if n != 1:
              raise SystemExit('Falha ao atualizar subtítulo das áreas de atuação.')

          details = {
              'Psicoterapia Individual': 'Processo clínico estruturado para compreender padrões de pensamento, emoção e comportamento e construir estratégias compatíveis com seus objetivos. Pode abordar ansiedade, depressão, luto, dificuldades relacionais, regulação emocional, traumas e momentos de transição, com acompanhamento individualizado e revisão periódica do plano terapêutico.',
              'Terapia de Casal': 'Atendimento voltado à compreensão dos ciclos de conflito, comunicação e necessidades relacionais do casal. O trabalho busca ampliar diálogo, clareza de acordos e capacidade de tomada de decisão, seja para reconstruir o vínculo, reorganizar a convivência ou atravessar processos de separação com maior consciência e respeito.',
              'Avaliação Psicológica<br />(Dra. Thaís Campos)': 'Processo técnico conduzido pela Dra. Thaís Campos, com definição de demanda, seleção de métodos e integração das informações obtidas. Pode contribuir para a compreensão de aspectos emocionais, cognitivos e comportamentais, formulação de hipóteses e planejamento de condutas, dentro dos limites éticos e técnicos da avaliação psicológica.',
              'Produtividade 2.0': 'Programa voltado à relação entre desempenho, organização e saúde emocional. Trabalha planejamento de rotina, prioridades, atenção, procrastinação, limites e prevenção de sobrecarga, buscando um modo de produzir com mais consistência sem transformar produtividade em autocobrança permanente.',
          }

          def update_detail(doc, title_html, new_detail):
              pat = re.compile(r'(<article class="service".*?<h3>' + re.escape(title_html) + r'</h3>.*?<p class="service-detail" aria-hidden="true">).*?(</p>)', re.S)
              updated, count = pat.subn(lambda m: m.group(1) + new_detail + m.group(2), doc, count=1)
              if count != 1:
                  raise SystemExit(f'Falha ao atualizar descrição de {title_html}.')
              return updated

          for title, detail in details.items():
              text = update_detail(text, title, detail)

          if '<h3>Dependência e Codependência Emocional</h3>' not in text:
              svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><rect width="640" height="420" rx="24" fill="#eef7f6"/><circle cx="260" cy="210" r="105" fill="none" stroke="#1b7f79" stroke-width="22"/><circle cx="380" cy="210" r="105" fill="none" stroke="#e67e22" stroke-width="22"/><path d="M320 272c-14-14-72-57-72-102 0-28 20-48 47-48 15 0 26 7 35 19 9-12 20-19 35-19 27 0 47 20 47 48 0 45-58 88-72 102l-10 9z" fill="#355e3b" opacity=".92"/></svg>'''
              svg_b64 = base64.b64encode(svg.encode('utf-8')).decode('ascii')
              wa_text = quote('Olá, gostaria de saber mais sobre atendimento para dependência e codependência emocional.')
              new_card = f'''

                <article class="service" tabindex="0" aria-label="Dependência e codependência emocional, clique para ver mais detalhes" aria-expanded="false">
                    <img src="data:image/svg+xml;base64,{svg_b64}" alt="Ilustração abstrata de vínculos emocionais e construção de autonomia" width="640" height="420" loading="lazy" decoding="async" />
                    <h3>Dependência e Codependência Emocional</h3>
                    <p class="service-tip">Clique no card para saber mais.</p>
                    <p class="service-detail" aria-hidden="true">Atendimento voltado a padrões de vínculo marcados por medo de abandono, dificuldade de estabelecer limites, necessidade excessiva de validação, autocancelamento ou permanência em relações que geram sofrimento. O processo busca ampliar autonomia emocional, reconhecer padrões repetitivos, fortalecer limites e construir relações mais recíprocas e seguras, sem reduzir a história da pessoa a um rótulo.</p>
                    <a href="https://api.whatsapp.com/send?phone=5535984640729&amp;text={wa_text}" class="service-cta">
                        <span>Agende Agora</span>
                        <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    </a>
                </article>'''
              prod_pat = re.compile(r'(\s*<article class="service"[^>]*aria-label="Programa Produtividade 2\.0.*?</article>)', re.S)
              m = prod_pat.search(text)
              if not m:
                  raise SystemExit('Card Produtividade 2.0 não localizado para inserir a quinta área.')
              text = text[:m.end()] + new_card + text[m.end():]

          path.write_text(text, encoding='utf-8')

          def service_articles(doc):
              return re.findall(r'<article class="service".*?</article>', doc, re.S)

          def service_by_title(doc, title):
              for article in service_articles(doc):
                  plain = re.sub(r'<[^>]+>', '', article)
                  if title in plain:
                      return article
              return ''

          def unique_ids(doc):
              ids = re.findall(r'\bid="([^"]+)"', doc)
              return len(ids) == len(set(ids))

          def internal_anchor_targets_exist(doc):
              ids = set(re.findall(r'\bid="([^"]+)"', doc))
              hrefs = re.findall(r'href="#([^"]+)"', doc)
              return all(h in ids for h in hrefs)

          def all_service_details_long(doc, min_chars=180):
              arts = service_articles(doc)
              if not arts:
                  return False
              for a in arts:
                  m = re.search(r'<p class="service-detail" aria-hidden="true">(.*?)</p>', a, re.S)
                  if not m or len(re.sub(r'<[^>]+>', '', m.group(1)).strip()) < min_chars:
                      return False
              return True

          def all_service_cards_complete(doc):
              for a in service_articles(doc):
                  required = ['<h3>', 'service-tip', 'service-detail', 'service-cta','aria-expanded="false"', 'tabindex="0"', '<img ', 'alt="','width="640"', 'height="420"', 'loading="lazy"', 'decoding="async"']
                  if not all(x in a for x in required):
                      return False
              return True

          titles = ['Psicoterapia Individual','Terapia de Casal','Avaliação Psicológica','Produtividade 2.0','Dependência e Codependência Emocional']

          def audit30(doc):
              arts = service_articles(doc)
              return [
                  ('01 Smoke', len(doc) > 10000 and '<!DOCTYPE html>' in doc),
                  ('02 Pinpoint', '<h2 id="sec-servicos" class="section-title">Áreas de Atuação</h2>' in doc),
                  ('03 Deep', len(arts) == 5 and all_service_details_long(doc)),
                  ('04 Consistency', all(t in re.sub(r'<[^>]+>', ' ', doc) for t in titles)),
                  ('05 Contradiction', 'Nossos Serviços Terapêuticos' not in doc),
                  ('06 Completeness', all_service_cards_complete(doc)),
                  ('07 Traceability', all(t in doc for t in ['sec-servicos', 'services-list', 'service-detail'])),
                  ('08 Compliance', 'sem promessas mágicas' in doc and 'urgência' in doc.lower()),
                  ('09 Regression', './anamnese.html' in doc and 'id="forms"' in doc),
                  ('10 Change-impact', 'const serviceCards = qsa(".service");' in doc),
                  ('11 Cross-reference', internal_anchor_targets_exist(doc)),
                  ('12 Link integrity', all('href="https://api.whatsapp.com/send?' in a for a in arts)),
                  ('13 Visual QA', 'repeat(5, minmax(0, 1fr))' in doc),
                  ('14 Accessibility', all('aria-label=' in a and 'aria-expanded="false"' in a for a in arts)),
                  ('15 Usability', all('Clique no card para saber mais.' in a for a in arts)),
                  ('16 Cognitive-load', len(arts) == 5 and all_service_details_long(doc, 180)),
                  ('17 Narrative-flow', doc.find('id="terapia"') < doc.find('id="servicos"') < doc.find('id="forms"')),
                  ('18 Red-team', not re.search(r'\b(cura garantida|resultado garantido|100% eficaz|milagre)\b', doc, re.I)),
                  ('19 Edge-case', '@media (max-width: 600px)' in doc and '.services-list' in doc),
                  ('20 Scenario stress', '@media (max-width: 1024px)' in doc and 'grid-template-columns: repeat(2, minmax(0, 1fr))' in doc),
                  ('21 Fact-check', 'SAMU (192)' in doc and 'Corpo de Bombeiros (193)' in doc),
                  ('22 Citation', not re.search(r'\bdoi:|\bet al\.|\[[0-9]+\]', doc, re.I)),
                  ('23 Source-to-claim', 'Aaron Beck' in doc and 'Jeffrey Young' in doc),
                  ('24 Legal defensibility', 'não substitui serviços de urgência' in doc.lower()),
                  ('25 Decision-readiness', all('Agende Agora' in a for a in arts)),
                  ('26 Publication preflight', '<meta name="viewport"' in doc and '<meta charset="UTF-8"' in doc),
                  ('27 Version-drift', 'Nossos Serviços Terapêuticos' not in doc and len(re.findall(r'<h3>Dependência e Codependência Emocional</h3>', doc)) == 1),
                  ('28 Canonical-template', all(v in doc for v in ['--brand: #1b7f79', '--accent: #e67e22', '--surface: #ffffff'])),
                  ('29 Duplication/redundancy', len(set(titles)) == 5 and len(arts) == 5),
                  ('30 Terminology', 'Áreas de Atuação' in doc and 'codependência' in doc.lower()),
              ]

          def audit90(doc):
              arts = service_articles(doc)
              checks = []
              def add(name, cond): checks.append((name, bool(cond)))
              add('01 Doctype', '<!DOCTYPE html>' in doc); add('02 Idioma pt-BR', '<html lang="pt-BR">' in doc); add('03 Charset UTF-8', '<meta charset="UTF-8"' in doc); add('04 Viewport', '<meta name="viewport"' in doc); add('05 Title', '<title>' in doc and '</title>' in doc); add('06 Meta description', '<meta name="description"' in doc); add('07 Robots', '<meta name="robots"' in doc); add('08 Open Graph title', 'property="og:title"' in doc); add('09 Open Graph description', 'property="og:description"' in doc); add('10 Theme color', '<meta name="theme-color"' in doc)
              add('11 H1 intencionais', len(re.findall(r'<h1\b', doc)) == 2); add('12 Main identificado', 'id="conteudo-principal"' in doc); add('13 Seção benefícios', 'id="sec-beneficios"' in doc); add('14 Seção biografia', 'id="biografia"' in doc); add('15 Seção intervenções', 'id="terapia"' in doc); add('16 Seção áreas', 'id="servicos"' in doc); add('17 Seção formulários', 'id="forms"' in doc); add('18 Ordem narrativa', doc.find('id="biografia"') < doc.find('id="terapia"') < doc.find('id="servicos"')); add('19 IDs únicos', unique_ids(doc)); add('20 Âncoras internas válidas', internal_anchor_targets_exist(doc))
              add('21 Exatamente cinco cards', len(arts) == 5)
              for i, title in enumerate(titles, start=22): add(f'{i:02d} Área presente — {title}', bool(service_by_title(doc, title)))
              add('27 Título Áreas de Atuação', '>Áreas de Atuação</h2>' in doc); add('28 Subtítulo explicita cinco frentes', 'Cinco frentes de cuidado' in doc); add('29 Grade desktop cinco colunas', 'repeat(5, minmax(0, 1fr))' in doc); add('30 Grade móvel uma coluna', '@media (max-width: 600px)' in doc and 'grid-template-columns: 1fr' in doc)
              for idx, title in enumerate(titles, start=31):
                  a = service_by_title(doc, title); m = re.search(r'<p class="service-detail" aria-hidden="true">(.*?)</p>', a, re.S) if a else None; detail = re.sub(r'<[^>]+>', '', m.group(1)).strip() if m else ''; add(f'{idx:02d} Descrição substantiva — {title}', len(detail) >= 180)
              add('36 Sem promessa de cura', 'cura garantida' not in doc.lower()); add('37 Sem promessa de resultado', 'resultado garantido' not in doc.lower()); add('38 Sem linguagem milagrosa', 'milagre terapêutico' not in doc.lower()); add('39 Linguagem não estigmatizante', 'sem reduzir a história da pessoa a um rótulo' in doc); add('40 Escopo de encaminhamento', 'encaminhamento quando indicado' in doc)
              add('41 Todos com tabindex', all('tabindex="0"' in a for a in arts)); add('42 Todos com aria-label', all('aria-label=' in a for a in arts)); add('43 Todos com aria-expanded', all('aria-expanded="false"' in a for a in arts)); add('44 Detalhes com aria-hidden', all('aria-hidden="true"' in a for a in arts)); add('45 Imagens com alt', all(re.search(r'<img [^>]*alt="[^"]+"', a) for a in arts)); add('46 Imagens com dimensões', all('width="640"' in a and 'height="420"' in a for a in arts)); add('47 Lazy loading', all('loading="lazy"' in a for a in arts)); add('48 Decoding async', all('decoding="async"' in a for a in arts)); add('49 Foco visível', ':focus-visible' in doc); add('50 Reduced motion', 'prefers-reduced-motion: reduce' in doc)
              add('51 Tip de interação', all('Clique no card para saber mais.' in a for a in arts)); add('52 CTA em todos os cards', all('service-cta' in a for a in arts)); add('53 WhatsApp em todos', all('api.whatsapp.com/send?' in a for a in arts)); add('54 CTA textual', all('Agende Agora' in a for a in arts)); add('55 Toggle por clique', 'addEventListener("click"' in doc); add('56 Toggle por teclado', 'keydown' in doc.lower()); add('57 Skip link', 'class="skip-link"' in doc); add('58 Voltar ao topo', 'id="scrollTopBtn"' in doc); add('59 Noscript', '<noscript>' in doc); add('60 Formulários preservados', doc.count('class="form-btn"') >= 12)
              add('61 Container máximo', '--container: 1200px' in doc); add('62 Grid 1024', '@media (max-width: 1024px)' in doc); add('63 Grid 900', '@media (max-width: 900px)' in doc); add('64 Grid 600', '@media (max-width: 600px)' in doc); add('65 Card radius', '--radius-xl: 20px' in doc); add('66 Cor de marca', '--brand: #1b7f79' in doc); add('67 Cor de acento', '--accent: #e67e22' in doc); add('68 Superfície branca', '--surface: #ffffff' in doc); add('69 Imagem object-fit', 'object-fit: cover' in doc); add('70 Cards alinhados', 'align-items: stretch' in doc)
              add('71 Aviso de urgência', 'não substitui serviços de urgência' in doc.lower()); add('72 SAMU', 'SAMU (192)' in doc); add('73 Bombeiros', 'Corpo de Bombeiros (193)' in doc); add('74 Sem diagnóstico definitivo', 'diagnóstico definitivo' not in doc.lower()); add('75 Avaliação com limites', 'limites éticos e técnicos da avaliação psicológica' in doc); add('76 Psicoterapia sem promessa', 'revisão periódica do plano terapêutico' in doc); add('77 Casal sem coerção', 'maior consciência e respeito' in doc); add('78 Produtividade sem hiperperformance', 'sem transformar produtividade em autocobrança permanente' in doc); add('79 Codependência sem rótulo', 'sem reduzir a história da pessoa a um rótulo' in doc); add('80 Sigilo mencionado', 'seguro e sigiloso' in doc)
              add('81 Sem TODO', 'TODO' not in doc); add('82 Sem lorem ipsum', 'lorem ipsum' not in doc.lower()); add('83 Sem href vazio', 'href=""' not in doc); add('84 Sem src vazio', 'src=""' not in doc); add('85 Links externos HTTPS', not re.search(r'href="http://', doc)); add('86 Imagem vetorial quinta área', 'data:image/svg+xml;base64,' in service_by_title(doc, 'Dependência e Codependência Emocional')); add('87 Telefones CTAs preservados', '5535984640729' in doc and '5535984647323' in doc); add('88 Anamnese preservada', 'href="./anamnese.html"' in doc); add('89 Conteúdo sem duplicação de quinta área', len(re.findall(r'<h3>Dependência e Codependência Emocional</h3>', doc)) == 1); add('90 Arquivo semanticamente íntegro', doc.strip().endswith('</html>'))
              if len(checks) != 90: raise AssertionError(f'A auditoria editorial deveria ter 90 controles, mas tem {len(checks)}.')
              return checks

          def run_and_print(label, checks):
              failures = [name for name, ok in checks if not ok]
              print(f'\n{label}: {len(checks) - len(failures)}/{len(checks)} aprovados')
              for name, ok in checks: print(f'  [{"PASS" if ok else "FAIL"}] {name}')
              return failures

          for cycle in range(1, 4):
              current = path.read_text(encoding='utf-8')
              print(f'\n================ CICLO {cycle}/3 ================')
              fail30 = run_and_print(f'Auditoria 30/30 — ciclo {cycle}', audit30(current))
              fail90 = run_and_print(f'Auditoria Editorial 90/90 — ciclo {cycle}', audit90(current))
              if fail30 or fail90:
                  print('Achados falhos:', fail30 + fail90)
                  sys.exit(1)
              print('Nenhum ponto falho neste ciclo; nenhum ajuste adicional necessário.')

          final = path.read_text(encoding='utf-8')
          class SmokeParser(HTMLParser):
              def __init__(self): super().__init__(); self.start_tags = 0
              def handle_starttag(self, tag, attrs): self.start_tags += 1
          parser = SmokeParser(); parser.feed(final)
          smoke_checks = [
              ('HTML parseável', parser.start_tags > 50),
              ('Cinco cards', len(service_articles(final)) == 5),
              ('Cinco títulos esperados', all(service_by_title(final, t) for t in titles)),
              ('CTAs funcionais por estrutura', all('api.whatsapp.com/send?' in a for a in service_articles(final))),
              ('Interação de cards preservada', 'const serviceCards = qsa(".service");' in final),
              ('Formulários preservados', 'id="forms"' in final and './anamnese.html' in final),
              ('Aviso de urgência preservado', 'SAMU (192)' in final and 'Corpo de Bombeiros (193)' in final),
              ('Responsividade preservada', '@media (max-width: 600px)' in final and '@media (max-width: 1024px)' in final),
              ('IDs únicos', unique_ids(final)),
              ('Âncoras internas válidas', internal_anchor_targets_exist(final)),
          ]
          smoke_fail = run_and_print('SMOKE TEST FINAL', smoke_checks)
          if smoke_fail: sys.exit(1)
          print('\nRESULTADO FINAL: 3 ciclos 30/30 + 90/90 aprovados; smoke test aprovado.')
          print('Arquivo alterado:', final != original)
          PY

      - name: Publicar alteração auditada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza Jornada Terapêutica para cinco áreas auditadas"
          git push
