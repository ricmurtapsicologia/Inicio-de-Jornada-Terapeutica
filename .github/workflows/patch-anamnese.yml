name: Aplicar integração da anamnese nativa

on:
  push:
    branches:
      - feat/anamnese-nativa
    paths:
      - scripts/patch-anamnese-link.mjs
      - .github/workflows/patch-anamnese.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anamnese-nativa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch
        run: |
          if [ -f scripts/patch-anamnese-link.mjs ]; then
            node scripts/patch-anamnese-link.mjs
          else
            echo "Script ainda não criado; nada a aplicar."
          fi
      - name: Validar HTML básico
        run: |
          test -f anamnese.html
          grep -q 'href="./anamnese.html"' index.html || true
      - name: Commitar patch, se houver
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html anamnese.html
          git commit -m "feat: liga jornada a anamnese nativa"
          git push origin HEAD:feat/anamnese-nativa
