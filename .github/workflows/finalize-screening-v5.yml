name: Finalize screening v5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-screening-v5.yml']
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bump canônico e remover metadados visuais antigos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/screening-system-v2.js');s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='2.3.0-unified-hero-identity';","const VERSION='2.5.0-v5-clinical';")
          s=s.replace('screening-public-experience-v2.json?v=4.0.0','screening-public-experience-v2.json?v=5.0.0')
          s=s.replace('screening-adapters-v2.json?v=4.0.0','screening-adapters-v2.json?v=5.0.0')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/screening-uniformity-v1.css');s=p.read_text(encoding='utf-8')
          s=s.replace('screening-visual-v4.css?v=4.0.0','screening-visual-v4.css?v=5.0.0')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/screening-uniformity-v1.js');s=p.read_text(encoding='utf-8')
          s=s.replace('screening-system-v2.js?v=2.4.0-no-svg','screening-system-v2.js?v=2.5.0-v5-clinical')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html');s=p.read_text(encoding='utf-8')
          hero='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/heroes/geral.jpg?v=5.0.0'
          s=re.sub(r'<meta\s+property=["\']og:image["\']\s+content=["\'][^"\']+["\']\s*/?>',f'<meta property="og:image" content="{hero}" />',s,count=1,flags=re.I)
          s=re.sub(r'<meta\s+property=["\']og:url["\']\s+content=["\'][^"\']+["\']\s*/?>','<meta property="og:url" content="https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/" />',s,count=1,flags=re.I)
          s=re.sub(r'\s*<link\s+rel=["\']icon["\']\s+href=["\']https://i\.pinimg\.com/[^"\']+["\']\s*/?>','',s,flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Gate de resíduos e sintaxe
        run: |
          set -euo pipefail
          ! grep -R "i.pinimg.com" index.html assets/screening-*.js assets/screening-*.css || false
          grep -q 'screening-public-experience-v2.json?v=5.0.0' assets/screening-system-v2.js
          grep -q 'screening-adapters-v2.json?v=5.0.0' assets/screening-system-v2.js
          grep -q 'screening-visual-v4.css?v=5.0.0' assets/screening-uniformity-v1.css
          grep -q 'screening-system-v2.js?v=2.5.0-v5-clinical' assets/screening-uniformity-v1.js
          node -e "new Function(require('fs').readFileSync('assets/screening-system-v2.js','utf8'));new Function(require('fs').readFileSync('assets/screening-uniformity-v1.js','utf8'))"
      - name: Commit
        run: |
          rm -f .github/workflows/finalize-screening-v5.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore(rastreios): fecha cache e metadados visuais v5'
          git push
