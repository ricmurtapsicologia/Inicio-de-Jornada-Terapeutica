name: Fix ICAPS SCALE final RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/fix-icaps-scale-final-rc.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Replace choice-index scoring with numeric SCALE scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/ScreeningScoringV3.gs')
          s=p.read_text(encoding='utf-8')
          old="const vals=r.slice(d*10,d*10+10).map(function(x){return scIdx_(x)*25;});"
          new="const vals=r.slice(d*10,d*10+10).map(function(x){return (scNum_(x,1,5)-1)*25;});"
          if old not in s:
              if new in s:
                  print('ICAPS scale fix already present')
              else:
                  raise SystemExit('ICAPS_TARGET_NOT_FOUND')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Dynamic ICAPS scorer gate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('apps-script/ScreeningScoringV3.gs','utf8');
          new Function(s);
          const recs=Array.from({length:60},(_,i)=>({response:String((i%5)+1),choiceIndex:-1,choices:[]}));
          const out=new Function(s+'\nreturn scoreIcapsV3_('+JSON.stringify(recs)+');')();
          if(out.subscales.length!==6) throw new Error('ICAPS_SUBSCALE_COUNT');
          if(out.subscales.some(x=>!Number.isFinite(x.rawScore)||x.rawScore<0||x.rawScore>100)) throw new Error('ICAPS_SCORE_RANGE');
          console.log('ICAPS_SCALE_1_5_PASS', JSON.stringify(out.subscales.map(x=>x.rawScore)));
          NODE
      - name: Commit source fix
        run: |
          if [ -z "$(git status --porcelain -- apps-script/ScreeningScoringV3.gs)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/ScreeningScoringV3.gs
          git commit -m 'Corrige ICAPS para respostas SCALE 1-5'
          git push
