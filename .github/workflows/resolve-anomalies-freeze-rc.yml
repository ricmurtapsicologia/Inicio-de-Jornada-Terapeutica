name: Resolve anomalies and freeze screening content RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/resolve-anomalies-freeze-rc.yml']

permissions:
  contents: write

jobs:
  resolve-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Extract canonical Esquemas questions from source and freeze all 15 instruments
        run: |
          set -euo pipefail
          mkdir -p audits/anomalies audits/content-locks
          curl -fsSL https://raw.githubusercontent.com/ricmurtapsicologia/rastreio.de.esquemas/main/index.html -o /tmp/esquemas.html
          cat > /tmp/resolve-freeze.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import vm from 'node:vm';

          const sha=s=>crypto.createHash('sha256').update(s,'utf8').digest('hex');
          const stable=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b))):v);
          function balanced(src,start,open,close){
            let depth=0, quote=null, esc=false;
            for(let i=start;i<src.length;i++){
              const c=src[i];
              if(quote){ if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;} if(c===quote){quote=null;} continue; }
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
              if(c===open) depth++;
              else if(c===close){ depth--; if(depth===0) return src.slice(start,i+1); }
            }
            throw new Error('UNBALANCED_BLOCK');
          }

          const html=fs.readFileSync('/tmp/esquemas.html','utf8');
          const marker='const questions = [';
          const pos=html.indexOf(marker);
          if(pos<0) throw new Error('ESQUEMAS_QUESTIONS_ARRAY_NOT_FOUND');
          const arrStart=html.indexOf('[',pos);
          const arrText=balanced(html,arrStart,'[',']');
          const questions=vm.runInNewContext('('+arrText+')',Object.create(null),{timeout:1000});
          if(!Array.isArray(questions)||questions.length<50) throw new Error('ESQUEMAS_IMPLAUSIBLE_COUNT:'+questions.length);
          questions.forEach((q,i)=>{
            if(Number(q.number)!==i+1) throw new Error(`ESQUEMAS_ORDER_DRIFT:${i+1}:${q.number}`);
            if(!String(q.text||'').trim()) throw new Error(`ESQUEMAS_EMPTY_TEXT:${i+1}`);
          });
          const opts=[
            ['1','Completamente falso sobre mim'],['2','Em grande parte falso sobre mim'],['3','Mais falso do que verdadeiro'],
            ['4','Mais verdadeiro do que falso'],['5','Em grande parte verdadeiro sobre mim'],['6','Completamente verdadeiro sobre mim']
          ].map(([value,label])=>({label,value}));
          const esquemaSpec={
            id:'esquemas',url:'https://ricmurtapsicologia.github.io/rastreio.de.esquemas/',selector:'#screeningForm',identityProfile:'screening_canonical',
            extraction:'SOURCE_ARRAY_CONST_QUESTIONS',questionCount:questions.length,
            questions:questions.map(q=>({order:Number(q.number),title:`${q.number}. ${q.text}`,type:'MULTIPLE_CHOICE',required:true,options:opts,name:q.id,schemaId:q.schemaId,styleHint:q.styleHint})),
            consoleErrors:[]
          };
          fs.writeFileSync('audits/mirror-specs/esquemas.json',JSON.stringify(esquemaSpec,null,2)+'\n');

          const modos=JSON.parse(fs.readFileSync('audits/mirror-specs/modos.json','utf8'));
          fs.writeFileSync('audits/anomalies/modos-console.json',JSON.stringify({id:'modos',consoleErrorCount:(modos.consoleErrors||[]).length,consoleErrors:modos.consoleErrors||[],questionCount:modos.questionCount,status:(modos.consoleErrors||[]).length?'REVIEW_REQUIRED':'CLEAR'},null,2)+'\n');

          const ids=['geral','tdah','bipolar','borderline','narcisismo','impulsividade','esquemas','modos','necessidades','codependencia','icaps','risco'];
          const locks={generatedAt:'2026-09-07',policy:'PRESERVE_QUESTIONS_ORDER_OPTIONS_UNLESS_EXPLICIT_CLINICAL_VERSION_CHANGE',instruments:{}};
          for(const id of ids){
            const s=JSON.parse(fs.readFileSync(`audits/mirror-specs/${id}.json`,'utf8'));
            const canonical=s.questions.map(q=>({order:q.order,title:q.title,type:q.type,required:q.required,options:(q.options||[]).map(o=>({label:o.label,value:o.value}))}));
            locks.instruments[id]={source:s.url,questionCount:s.questionCount,sha256:sha(stable(canonical)),status:'LOCKED_RC'};
          }

          const mon=fs.readFileSync('assets/monitoramentos-v2.js','utf8');
          function objectBlock(key){
            const re=new RegExp('\\n\\s*'+key+':\\{');
            const m=re.exec(mon); if(!m) throw new Error('MONITOR_BLOCK_NOT_FOUND:'+key);
            const start=mon.indexOf('{',m.index);
            return balanced(mon,start,'{','}');
          }
          for(const id of ['humor','ansiedade','autoestima']){
            const block=objectBlock(id);
            const count=(block.match(/\bchoice\('/g)||[]).length;
            if(count<1) throw new Error('MONITOR_QUESTION_COUNT_ZERO:'+id);
            if(id==='humor'&&count!==21) throw new Error('BDI2_QUESTION_COUNT_DRIFT:'+count);
            locks.instruments[id]={source:'assets/monitoramentos-v2.js',questionCount:count,sha256:sha(block),status:'LOCKED_RC',contentPolicy:id==='humor'?'BDI-II_21_GROUPS_PRESERVED':'PRESERVE_CURRENT_SCHEMA'};
          }
          if(Object.keys(locks.instruments).length!==15) throw new Error('LOCK_COUNT_DRIFT');
          fs.writeFileSync('audits/content-locks/content-locks-rc-20260907.json',JSON.stringify(locks,null,2)+'\n');

          const summary=JSON.parse(fs.readFileSync('audits/mirror-specs/summary.json','utf8'));
          const row=summary.instruments.find(x=>x.id==='esquemas');
          if(row){row.questionCount=questions.length;row.error=null;row.consoleErrorCount=0;row.extraction='SOURCE_ARRAY_CONST_QUESTIONS';}
          summary.updatedAt='2026-09-07';
          fs.writeFileSync('audits/mirror-specs/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({esquemasQuestions:questions.length,modosConsole:modos.consoleErrors||[],locks:Object.fromEntries(Object.entries(locks.instruments).map(([k,v])=>[k,v.questionCount]))},null,2));
          NODE
          node /tmp/resolve-freeze.mjs
      - name: Validate BDI-II lock and 15 content locks
        run: |
          node tests/bdi2-content-lock.test.mjs
          node -e "const x=require('./audits/content-locks/content-locks-rc-20260907.json'); if(Object.keys(x.instruments).length!==15) process.exit(1); console.log('CONTENT_LOCKS_15_PASS')"
      - name: Commit resolved specs and locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/mirror-specs/esquemas.json audits/mirror-specs/summary.json audits/anomalies/modos-console.json audits/content-locks/content-locks-rc-20260907.json
          git commit -m 'Resolve Esquemas e congela conteúdo dos 15 rastreios'
          git push
