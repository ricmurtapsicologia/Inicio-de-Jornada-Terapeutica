          if(Object.keys(map.instruments).length!==15)throw Error('map15');
          const expected={geral:70,tdah:85,bipolar:77,borderline:47,narcisismo:112,impulsividade:30,esquemas:108,modos:124,necessidades:36,codependencia:40,icaps:60,risco:18,humor:21,ansiedade:14,autoestima:10};
          for(const [id,n] of Object.entries(expected))if(map.instruments[id].expectedCount!==n)throw Error(`${id}:${map.instruments[id].expectedCount}:${n}`);
          const bridge=fs.readFileSync('apps-script/ScreeningBridgeV3.gs','utf8');
          if(!bridge.includes("VERSION: 'screening-bridge-v3.1'"))throw Error('version');
          if(!bridge.includes('payload.responses')||bridge.includes('payload.answers'))throw Error('ordered payload');
          if(bridge.includes('isAcceptingResponses'))throw Error('must not require public Forms');
