          const orch=fs.readFileSync('apps-script/ScreeningOrchestratorV3.gs','utf8');
          if(orch.includes('payload.answers'))throw Error('orchestrator old contract');
          const client=fs.readFileSync('assets/screening-submit-v3.js','utf8');
          if(!client.includes('responses')||client.includes('answers:'))throw Error('client ordered contract');
          console.log('ORDERED_TRANSPORT_15_PASS');
          NODE
