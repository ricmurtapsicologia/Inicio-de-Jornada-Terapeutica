name: Ordered transport v3.1 RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/ordered-transport-v31-rc.yml']

permissions:
  contents: write

jobs:
  ordered-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907

      - name: Build canonical response map
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root=pathlib.Path('.')
          ids=['geral','tdah','bipolar','borderline','narcisismo','impulsividade','esquemas','modos','necessidades','codependencia','risco']
          out={'schemaVersion':'3.1.0','contract':'clinical responses are transported by canonical order, never by title','instruments':{}}
          for iid in ids:
              spec=json.loads((root/f'audits/mirror-specs/{iid}.json').read_text(encoding='utf-8'))
              keys=[]
              for q in spec['questions']:
                  key=str(q.get('name') or '').strip()
                  if not key:
                      raise SystemExit(f'{iid}:missing control key at {q.get("order")}')
                  keys.append(key)
              if len(keys)!=spec['questionCount']:
                  raise SystemExit(f'{iid}:map count drift')
              if len(set(keys))!=len(keys):
                  raise SystemExit(f'{iid}:duplicate control key')
              out['instruments'][iid]={'mode':'named_controls','formSelector':spec['selector'],'expectedCount':len(keys),'keys':keys}
          data=json.load(urllib.request.urlopen('https://raw.githubusercontent.com/ricmurtapsicologia/ICAPS/main/data/icaps-v2.json'))
          keys=[item['id'] for d in data['dimensions'] for item in d['items']]
          if len(keys)!=60 or len(set(keys))!=60:
              raise SystemExit('icaps key contract invalid')
          out['instruments']['icaps']={'mode':'named_controls','formSelector':'#icaps-form','expectedCount':60,'keys':keys}
          out['instruments']['humor']={'mode':'field_card_order','formSelector':'#clinical-form','expectedCount':21}
          out['instruments']['ansiedade']={'mode':'field_card_order','formSelector':'#clinical-form','expectedCount':14}
          out['instruments']['autoestima']={'mode':'field_card_order','formSelector':'#clinical-form','expectedCount':10}
          if len(out['instruments'])!=15:
              raise SystemExit('response map must contain 15 instruments')
          (root/'assets/screening-response-map-v3.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Replace bridge with ordered contract
        run: |
          cat > apps-script/ScreeningBridgeV3.gs <<'GS'
          /** Unified ordered bridge for 15 clinical screenings. */
          const SCREENING_BRIDGE = Object.freeze({
            VERSION: 'screening-bridge-v3.1',
            MESSAGE_TYPE: 'RM_SCREENING_SUBMIT_RESULT',
            CACHE_TTL_SECONDS: 21600,
            MIN_FILL_MS: 1500,
            INSTRUMENTS: Object.freeze({
              geral:{formProperty:'FORM_ID_GERAL'},tdah:{formProperty:'FORM_ID_TDAH'},bipolar:{formProperty:'FORM_ID_BIPOLAR'},
              borderline:{formProperty:'FORM_ID_BORDERLINE'},narcisismo:{formProperty:'FORM_ID_NARCISISMO'},impulsividade:{formProperty:'FORM_ID_IMPULSIVIDADE'},
              esquemas:{formProperty:'FORM_ID_ESQUEMAS'},modos:{formProperty:'FORM_ID_MODOS'},necessidades:{formProperty:'FORM_ID_NECESSIDADES'},
              codependencia:{formProperty:'FORM_ID_CODEPENDENCIA'},icaps:{formProperty:'FORM_ID_ICAPS'},humor:{formProperty:'FORM_ID_HUMOR'},
              ansiedade:{formProperty:'FORM_ID_ANSIEDADE'},autoestima:{formProperty:'FORM_ID_AUTOESTIMA'},risco:{formProperty:'FORM_ID_RISCO'}
            })
          });
          const SCREENING_IDENTITY_TITLES = Object.freeze({
            'Nome completo':'name','Data de nascimento':'birthDate','Data de aplicação do rastreio':'applicationDate'
          });

          function doGet(){
            const props=PropertiesService.getScriptProperties(),configured={};
            Object.keys(SCREENING_BRIDGE.INSTRUMENTS).forEach(function(id){configured[id]=Boolean(props.getProperty(SCREENING_BRIDGE.INSTRUMENTS[id].formProperty));});
            return screeningBridgeHtml_({ok:true,health:true,version:SCREENING_BRIDGE.VERSION,configured:configured});
          }

          function doPost(e){
            const lock=LockService.getScriptLock();
            if(!lock.tryLock(10000))return screeningBridgeHtml_({ok:false,code:'BUSY',message:'Canal temporariamente ocupado.'});
            try{
              const raw=e&&e.parameter?e.parameter.payload:''; if(!raw)throw new Error('PAYLOAD_MISSING');
              let payload; try{payload=JSON.parse(raw);}catch(_){throw new Error('PAYLOAD_INVALID');}
              validateScreeningEnvelope_(payload);
              const cache=CacheService.getScriptCache(),cacheKey='screening:'+payload.instrumentId+':'+payload.submissionId;
              if(cache.get(cacheKey))return screeningBridgeHtml_({ok:true,duplicate:true,submissionId:payload.submissionId,instrumentId:payload.instrumentId});
              const instrument=SCREENING_BRIDGE.INSTRUMENTS[payload.instrumentId];
              const formId=PropertiesService.getScriptProperties().getProperty(instrument.formProperty);
              if(!formId)throw new Error('FORM_ID_NOT_CONFIGURED:'+payload.instrumentId);
              const form=FormApp.openById(formId);
              const contract=buildScreeningOrderedContract_(form);
              validateScreeningOrderedPayload_(payload,contract);
              const records=screeningScoringRecordsOrdered_(contract.clinical,payload.responses);
              const formResponse=form.createResponse();
              appendScreeningIdentityResponses_(formResponse,contract.identity,payload.identity);
              contract.clinical.forEach(function(entry,i){
                const value=payload.responses[i]; if(screeningBlank_(value))return;
                const ir=createScreeningItemResponse_(entry.item,entry.type,value); if(ir)formResponse.withItemResponse(ir);
              });
              const submittedResponse=formResponse.submit();
              cache.put(cacheKey,'1',SCREENING_BRIDGE.CACHE_TTL_SECONDS);
              let processing='complete';
              try{
                const responseId=String((submittedResponse&&submittedResponse.getId&&submittedResponse.getId())||payload.submissionId);
                runScreeningPostProcessingV3_({form:form,payload:payload,formResponseId:responseId,records:records});
              }catch(postErr){processing='pending';console.error('ScreeningPostProcess:'+screeningSafePostProcessError_(postErr));}
              return screeningBridgeHtml_({ok:true,submissionId:payload.submissionId,instrumentId:payload.instrumentId,processing:processing});
            }catch(err){
              console.error('ScreeningBridge:'+screeningSafeError_(err));
              return screeningBridgeHtml_({ok:false,code:screeningSafeCode_(err),message:'Não foi possível confirmar o registro. As respostas permanecem na página para nova tentativa.'});
            }finally{lock.releaseLock();}
          }

          function validateScreeningEnvelope_(payload){
            if(!payload||typeof payload!=='object'||Array.isArray(payload))throw new Error('ENVELOPE_INVALID');
            if(payload.version!==SCREENING_BRIDGE.VERSION)throw new Error('VERSION_UNSUPPORTED');
            if(!Object.prototype.hasOwnProperty.call(SCREENING_BRIDGE.INSTRUMENTS,payload.instrumentId))throw new Error('INSTRUMENT_NOT_ALLOWED');
            if(!payload.submissionId||String(payload.submissionId).length>120)throw new Error('SUBMISSION_ID_INVALID');
            if(!payload.identity||typeof payload.identity!=='object'||Array.isArray(payload.identity))throw new Error('IDENTITY_INVALID');
            if(!Array.isArray(payload.responses))throw new Error('RESPONSES_INVALID');
            const startedAt=Number(payload.startedAt||0),submittedAt=Number(payload.submittedAt||0);
            if(!startedAt||!submittedAt||submittedAt-startedAt<SCREENING_BRIDGE.MIN_FILL_MS)throw new Error('SUBMISSION_TOO_FAST');
          }

          function buildScreeningOrderedContract_(form){
            const identity={},clinical=[];
            form.getItems().forEach(function(item){
              const type=item.getType(); if(!screeningAnswerableType_(type))return;
              const title=String(item.getTitle()||'').trim();
              const key=SCREENING_IDENTITY_TITLES[title];
              const entry={item:item,type:type,title:title};
              if(key){if(identity[key])throw new Error('DUPLICATE_IDENTITY_ITEM:'+key);identity[key]=entry;}else clinical.push(entry);
            });
            if(!identity.name||!identity.applicationDate)throw new Error('FORM_IDENTITY_CONTRACT_INVALID');
            return {identity:identity,clinical:clinical};
          }

          function validateScreeningOrderedPayload_(payload,contract){
            if(payload.responses.length!==contract.clinical.length)throw new Error('RESPONSE_COUNT_MISMATCH:'+payload.responses.length+':'+contract.clinical.length);
            const id=payload.identity||{};
            ['name','birthDate','applicationDate'].forEach(function(key){
              const entry=contract.identity[key]; if(entry&&screeningItemRequired_(entry.item,entry.type)&&screeningBlank_(id[key]))throw new Error('REQUIRED_IDENTITY_MISSING:'+key);
            });
            contract.clinical.forEach(function(entry,i){if(screeningItemRequired_(entry.item,entry.type)&&screeningBlank_(payload.responses[i]))throw new Error('REQUIRED_ANSWER_MISSING:'+String(i+1));});
          }

          function appendScreeningIdentityResponses_(formResponse,identityContract,identity){
            ['name','birthDate','applicationDate'].forEach(function(key){
              const entry=identityContract[key],value=identity&&identity[key]; if(!entry||screeningBlank_(value))return;
              const ir=createScreeningItemResponse_(entry.item,entry.type,value); if(ir)formResponse.withItemResponse(ir);
            });
          }

          function screeningAnswerableType_(type){return [FormApp.ItemType.TEXT,FormApp.ItemType.PARAGRAPH_TEXT,FormApp.ItemType.MULTIPLE_CHOICE,FormApp.ItemType.CHECKBOX,FormApp.ItemType.SCALE,FormApp.ItemType.LIST,FormApp.ItemType.DATE,FormApp.ItemType.TIME,FormApp.ItemType.DURATION,FormApp.ItemType.GRID,FormApp.ItemType.CHECKBOX_GRID].indexOf(type)>=0;}
          function screeningItemRequired_(item,type){try{switch(type){case FormApp.ItemType.TEXT:return item.asTextItem().isRequired();case FormApp.ItemType.PARAGRAPH_TEXT:return item.asParagraphTextItem().isRequired();case FormApp.ItemType.MULTIPLE_CHOICE:return item.asMultipleChoiceItem().isRequired();case FormApp.ItemType.CHECKBOX:return item.asCheckboxItem().isRequired();case FormApp.ItemType.SCALE:return item.asScaleItem().isRequired();case FormApp.ItemType.LIST:return item.asListItem().isRequired();case FormApp.ItemType.DATE:return item.asDateItem().isRequired();case FormApp.ItemType.TIME:return item.asTimeItem().isRequired();case FormApp.ItemType.DURATION:return item.asDurationItem().isRequired();case FormApp.ItemType.GRID:return item.asGridItem().isRequired();case FormApp.ItemType.CHECKBOX_GRID:return item.asCheckboxGridItem().isRequired();default:return false;}}catch(_){return false;}}
          function createScreeningItemResponse_(item,type,rawValue){switch(type){case FormApp.ItemType.TEXT:return item.asTextItem().createResponse(String(rawValue));case FormApp.ItemType.PARAGRAPH_TEXT:return item.asParagraphTextItem().createResponse(String(rawValue));case FormApp.ItemType.MULTIPLE_CHOICE:return item.asMultipleChoiceItem().createResponse(String(rawValue));case FormApp.ItemType.CHECKBOX:return item.asCheckboxItem().createResponse(Array.isArray(rawValue)?rawValue.map(String):[String(rawValue)]);case FormApp.ItemType.SCALE:return item.asScaleItem().createResponse(Number(rawValue));case FormApp.ItemType.LIST:return item.asListItem().createResponse(String(rawValue));case FormApp.ItemType.DATE:return item.asDateItem().createResponse(new Date(String(rawValue)+'T12:00:00'));case FormApp.ItemType.TIME:{const p=String(rawValue).split(':');return item.asTimeItem().createResponse(Number(p[0]||0),Number(p[1]||0));}case FormApp.ItemType.DURATION:{const d=String(rawValue).split(':').map(Number);return item.asDurationItem().createResponse(d[0]||0,d[1]||0,d[2]||0);}case FormApp.ItemType.GRID:return item.asGridItem().createResponse(Array.isArray(rawValue)?rawValue.map(String):[]);case FormApp.ItemType.CHECKBOX_GRID:return item.asCheckboxGridItem().createResponse(Array.isArray(rawValue)?rawValue:[]);default:return null;}}
          function screeningBlank_(value){if(value===null||typeof value==='undefined')return true;if(Array.isArray(value))return value.length===0||value.every(function(v){return String(v).trim()==='';});return String(value).trim()==='';}
          function screeningSafeCode_(err){const msg=err&&err.message?String(err.message):'';return String(msg.split(':')[0]||'TECHNICAL_ERROR').slice(0,80);}
          function screeningSafeError_(err){return err&&err.message?String(err.message).slice(0,180):'technical_error';}
          function screeningBridgeHtml_(data){const message=Object.assign({type:SCREENING_BRIDGE.MESSAGE_TYPE},data||{});const json=JSON.stringify(message).replace(/</g,'\\u003c');const html='<!doctype html><html><head><meta charset="utf-8"></head><body><script>try{parent.postMessage('+json+',"*");}catch(e){}</script></body></html>';return HtmlService.createHtmlOutput(html).setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);}
          GS

      - name: Patch scoring and orchestrator to ordered records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps-script/ScreeningScoringV3.gs')
          s=p.read_text(encoding='utf-8')
          start=s.index('function screeningScoringRecords_(')
          end=s.index('\nfunction scNum_',start)
          repl=r'''function screeningScoringRecordsOrdered_(clinicalEntries,responses) {
            if (!Array.isArray(clinicalEntries) || !Array.isArray(responses) || clinicalEntries.length !== responses.length) throw new Error('SCORING_RECORD_COUNT_MISMATCH');
            return clinicalEntries.map(function(entry,i){
              const item=entry.item,type=entry.type,response=responses[i];
              let choices=[];
              try {
                if (type === FormApp.ItemType.MULTIPLE_CHOICE) choices=item.asMultipleChoiceItem().getChoices().map(function(c){return c.getValue();});
                else if (type === FormApp.ItemType.LIST) choices=item.asListItem().getChoices().map(function(c){return c.getValue();});
              } catch (_) {}
              const usable=choices.filter(function(c){return !/^selecione(?:\.\.\.)?$/i.test(String(c).trim());});
              return {title:String(entry.title||item.getTitle()||'').trim(),response:response,choiceIndex:usable.indexOf(String(response)),choices:usable,identity:false,order:i+1};
            });
          }
'''
          p.write_text(s[:start]+repl+s[end:],encoding='utf-8')

          p=Path('apps-script/ScreeningOrchestratorV3.gs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const records=screeningScoringRecords_(context.form,payload.answers);","const records=context.records||screeningScoringRecordsOrdered_(buildScreeningOrderedContract_(context.form).clinical,payload.responses);")
          s=s.replace("const a=payload.answers||{};","const a=payload.identity||{};")
          s=s.replace("patient:{name:String(a['Nome completo']||'').trim(),birthDate:String(a['Data de nascimento']||'').trim()},","patient:{name:String(a.name||'').trim(),birthDate:String(a.birthDate||'').trim()},")
          s=s.replace("applicationDate:String(a['Data de aplicação do rastreio']||'').trim(),","applicationDate:String(a.applicationDate||'').trim(),")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add deployment setup from Forms Factory
        run: |
          cat > apps-script/ScreeningSetupV3.gs <<'GS'
          const SCREENING_FACTORY_SHEET_ID='178f4QTs_yER23Aa8wAjD3KFBHc6ze-kX8NCC8_F5BgU';
          const SCREENING_FACTORY_FORM_MAP=Object.freeze({
            geral:'FORM-2026-0004',tdah:'FORM-2026-0005',bipolar:'FORM-2026-0006',borderline:'FORM-2026-0007',narcisismo:'FORM-2026-0008',impulsividade:'FORM-2026-0009',esquemas:'FORM-2026-0010',modos:'FORM-2026-0011',necessidades:'FORM-2026-0012',codependencia:'FORM-2026-0013',risco:'FORM-2026-0014',humor:'FORM-2026-0015',ansiedade:'FORM-2026-0016',autoestima:'FORM-2026-0017',icaps:'FORM-2026-0003'
          });
          function setupScreeningBridgeV3FromFactory(){
            const sh=SpreadsheetApp.openById(SCREENING_FACTORY_SHEET_ID).getSheetByName('FORMULARIOS');
            const values=sh.getDataRange().getValues(),byInternal={};
            values.slice(1).forEach(function(r){if(r[0]&&r[17])byInternal[String(r[0])]=String(r[17]);});
            const props=PropertiesService.getScriptProperties(),updates={REPORT_EMAIL:'ricmurtapsicologia@gmail.com',TRELLO_CARD_ID:'6a9e3f9c43f65edff401783a'};
            Object.keys(SCREENING_FACTORY_FORM_MAP).forEach(function(id){
              const internal=SCREENING_FACTORY_FORM_MAP[id],formId=byInternal[internal]; if(!formId)throw new Error('FACTORY_FORM_ID_MISSING:'+internal);
              updates[SCREENING_BRIDGE.INSTRUMENTS[id].formProperty]=formId;
            });
            props.setProperties(updates,false);
            ['humor','ansiedade','autoestima'].forEach(function(id){
              const form=FormApp.openById(updates[SCREENING_BRIDGE.INSTRUMENTS[id].formProperty]);
              form.getItems(FormApp.ItemType.DATE).forEach(function(item){if(String(item.getTitle()).trim()==='Data de nascimento')item.asDateItem().setRequired(false);});
            });
            return {ok:true,configured:Object.keys(SCREENING_FACTORY_FORM_MAP).length,trelloCredentialsConfigured:Boolean(props.getProperty('TRELLO_KEY')&&props.getProperty('TRELLO_TOKEN'))};
          }
          GS

      - name: Add centralized client ordered transport
        run: |
          cat > assets/screening-transport-v3.json <<'JSON'
          {"version":"screening-bridge-v3.1","bridgeUrl":"","enabled":false}
          JSON
          cat > assets/screening-submit-v3.js <<'JS'
          (()=>{
          'use strict';
          const VERSION='screening-bridge-v3.1';
          const MAP_URL='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-response-map-v3.json';
          const TRANSPORT_URL='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-transport-v3.json';
          const REPOS={'Rastreioclinico':'geral','rastreioTDAH':'tdah','tab-bateria-integrada':'bipolar','Inventario-de-Tracos-Borderline':'borderline','bateria.narcisismo':'narcisismo','Rastreio-de-Impulsividade':'impulsividade','rastreio.de.esquemas':'esquemas','rastreiomodosesquematicos':'modos','Escala-de-Necessidades-Emocionais':'necessidades','Escala-de-Co-Depenpencia-Emocional':'codependencia','ICAPS':'icaps','TriagemRiscoSuicidio':'risco'};
          const startedAt=Date.now(); let pendingId='',pendingButton=null,timer=null,config=null,map=null;
          function instrument(){const seg=location.pathname.split('/').filter(Boolean)[0]||'';return seg==='Inicio-de-Jornada-Terapeutica'?(new URLSearchParams(location.search).get('instrument')||''):(REPOS[seg]||'');}
          function uuid(){return globalThis.crypto?.randomUUID?crypto.randomUUID():'rm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
          function today(){const d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10);}
          function valueForKey(form,key){const esc=globalThis.CSS?.escape?CSS.escape(key):key.replace(/(["\\.#:[\]()>+~*'= ])/g,'\\$1');let els=[...form.querySelectorAll(`[name="${esc}"]`)];if(!els.length){const byId=form.querySelector('#'+esc);if(byId)els=[byId];}if(!els.length)throw new Error('CONTROL_NOT_FOUND:'+key);const type=String(els[0].type||'').toLowerCase();if(type==='radio'){const x=els.find(e=>e.checked);return x?x.value:'';}if(type==='checkbox'){const a=els.filter(e=>e.checked).map(e=>e.value);return els.length===1?(a[0]||''):a;}return els[0].value??'';}
          function valueForCard(card){const checked=[...card.querySelectorAll('input[type="radio"]:checked,input[type="checkbox"]:checked')];if(checked.length>1)return checked.map(x=>x.value);if(checked.length===1)return checked[0].value;const c=card.querySelector('input:not([type="hidden"]),select,textarea');return c?c.value:'';}
          function collect(form,spec){if(spec.mode==='field_card_order'){const cards=[...form.querySelectorAll('.field-card')];if(cards.length!==spec.expectedCount)throw new Error('CARD_COUNT:'+cards.length+':'+spec.expectedCount);return cards.map(valueForCard);}const values=spec.keys.map(k=>valueForKey(form,k));if(values.length!==spec.expectedCount)throw new Error('MAP_COUNT');return values;}
          function showError(form,msg){let box=form.querySelector('.rm-v3-submit-error');if(!box){box=document.createElement('div');box.className='rm-v3-submit-error';box.setAttribute('role','alert');(form.querySelector('.form-footer,.actions')||form).prepend(box);}box.textContent=msg;}
          function setBusy(button,busy){if(!button)return;button.disabled=busy;button.setAttribute('aria-busy',busy?'true':'false');}
          function post(form,id,responses){pendingId=uuid();pendingButton=form.querySelector('button[type="submit"],input[type="submit"]');setBusy(pendingButton,true);const identity=window.RMScreeningUI?.getIdentity?.()||{};const payload={version:VERSION,instrumentId:id,submissionId:pendingId,startedAt,submittedAt:Date.now(),identity:{name:String(identity.name||'').trim(),birthDate:String(identity.birthDate||'').trim(),applicationDate:String(identity.applicationDate||today()).trim()},responses};let sink=document.getElementById('rm-screening-v3-sink');if(!sink){sink=document.createElement('iframe');sink.id='rm-screening-v3-sink';sink.name='rm-screening-v3-sink';sink.hidden=true;document.body.appendChild(sink);}const transport=document.createElement('form');transport.method='post';transport.action=config.bridgeUrl;transport.target=sink.name;transport.hidden=true;const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);transport.appendChild(input);document.body.appendChild(transport);transport.submit();transport.remove();clearTimeout(timer);timer=setTimeout(()=>{if(!pendingId)return;pendingId='';setBusy(pendingButton,false);showError(form,'O envio não pôde ser confirmado. Verifique sua conexão e tente novamente.');},25000);}
          window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='RM_SCREENING_SUBMIT_RESULT'||!pendingId||d.submissionId!==pendingId)return;clearTimeout(timer);const form=document.querySelector(map?.instruments?.[instrument()]?.formSelector||'form');if(d.ok===true){const id=pendingId;pendingId='';window.RMScreeningUI?.confirmDelivery?.({instrumentId:instrument(),submissionId:id,receipt:'apps_script_ordered_v31',processing:d.processing||'complete'});return;}pendingId='';setBusy(pendingButton,false);if(form)showError(form,d.message||'Não foi possível confirmar o registro. Tente novamente.');});
          Promise.all([fetch(MAP_URL,{cache:'no-store'}).then(r=>r.json()),fetch(TRANSPORT_URL,{cache:'no-store'}).then(r=>r.json())]).then(([m,c])=>{map=m;config=c;if(!config.enabled||config.version!==VERSION||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(config.bridgeUrl||''))return;const id=instrument(),spec=map.instruments?.[id];if(!spec)return;document.addEventListener('submit',e=>{const form=e.target;if(!form.matches(spec.formSelector))return;if(!form.checkValidity())return;e.preventDefault();e.stopImmediatePropagation();try{post(form,id,collect(form,spec));}catch(err){setBusy(pendingButton,false);showError(form,'Revise as respostas antes de concluir o rastreio.');console.error(String(err&&err.message||err));}},true);}).catch(err=>console.error('SCREENING_V3_CLIENT:'+String(err&&err.message||err)));
          })();
          JS

      - name: Load central client and disable legacy monitoring transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/screening-uniformity-v1.js');s=p.read_text(encoding='utf-8')
          if "RM_SCREENING_V3_CLIENT" not in s:
              s=s.replace("'use strict';","'use strict';\nwindow.RM_SCREENING_V3_CLIENT=true;",1)
              insert="""
          if(!document.querySelector('script[data-rm-submit-v3]')){
            const t=document.createElement('script');t.src='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-submit-v3.js?v=3.1.0';t.defer=true;t.dataset.rmSubmitV3='true';document.head.appendChild(t);
          }
          """
              s=s.replace("})();",insert+"\n})();",1)
          p.write_text(s,encoding='utf-8')
          p=Path('assets/monitoramentos-receipt-bridge-v2.js');s=p.read_text(encoding='utf-8')
          if 'RM_SCREENING_V3_CLIENT' not in s:
              s=s.replace("'use strict';","'use strict';\nif(window.RM_SCREENING_V3_CLIENT===true)return;",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static ordered-contract gates
        run: |
          node <<'NODE'
          const fs=require('fs');
