name: Branded questionnaire quality
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'monitoramento.html'
      - 'assets/monitoramentos-v2.*'
      - 'tests/branded-questionnaires.test.mjs'
      - '.github/workflows/questionnaire-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'monitoramento.html'
      - 'assets/monitoramentos-v2.*'
      - 'tests/branded-questionnaires.test.mjs'
      - '.github/workflows/questionnaire-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and contract checks
        run: |
          node --check assets/monitoramentos-v2.js
          node tests/branded-questionnaires.test.mjs
      - name: Browser smoke without submission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/journey-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done
          test -n "$browser" || { echo 'Chromium indisponível'; exit 1; }
          profile="/tmp/journey-browser-$RANDOM"
          dom="$($browser --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --user-data-dir="$profile" --dump-dom 'http://127.0.0.1:8766/monitoramento.html?instrument=ansiedade' 2>/tmp/journey-browser.log || true)"
          grep -q 'Monitoramento de Ansiedade' <<<"$dom"
          grep -q 'id="clinical-form"' <<<"$dom"
          grep -q '0% concluído' <<<"$dom"
          ! grep -q '>Google Forms<' <<<"$dom"
          ! grep -Eq '<iframe[^>]+src="https://docs.google.com/forms' <<<"$dom"
          echo 'BRANDED_BROWSER_SMOKE_PASS'
