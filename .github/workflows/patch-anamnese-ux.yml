name: Aplicar refinamento UX da anamnese

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-anamnese-ux.mjs
      - .github/workflows/patch-anamnese-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch
        run: node scripts/patch-anamnese-ux.mjs
      - name: Validar estrutura antes do commit
        run: |
          node tests/validate-anamnese.mjs
          npx --yes html-validate@9 anamnese.html
      - name: Commitar refinamento
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anamnese.html
          git commit -m "fix: melhora UX visual e confirmação da anamnese"
          git push origin HEAD:main
