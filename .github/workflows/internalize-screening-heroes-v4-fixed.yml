name: Internalize Screening Heroes v4 fixed
on:
  push:
    paths: ['.github/workflows/internalize-screening-heroes-v4-fixed.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Internalizar 15 heroes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes audits
          get(){ id="$1"; photo="$2"; url="https://images.unsplash.com/${photo}?auto=format&fit=crop&w=1600&q=82&fm=jpg"; echo "$id <- $photo"; curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "assets/heroes/${id}.jpg"; test "$(wc -c < "assets/heroes/${id}.jpg")" -gt 20000; file "assets/heroes/${id}.jpg" | grep -Eqi 'JPEG|PNG|WebP|image'; }
          get geral photo-1775129667554-1ba0db7fabe8
          get tdah photo-1676287568293-8cd7917e7d95
          get bipolar photo-1525596973188-6419210b32d3
          get borderline photo-1669907827996-f4bd504dfc34
          get narcisismo photo-1625750331870-624de6fd3452
          get impulsividade photo-1753620033339-0caedb79ce03
          get esquemas photo-1770958254155-8ea7166b114a
          get modos photo-1771760564125-f5430486dc1a
          get necessidades photo-1769364968556-912be8f53843
          get codependencia photo-1724246067186-329e027eb629
          get icaps photo-1718724588305-fbc4d628d0f9
          get risco photo-1763333868819-9ae30223a897
          get humor photo-1766983025422-74ff44983027
          get ansiedade photo-1775325064842-a44e99eb2600
          get autoestima photo-1770731959681-3ef897ba96f2
      - name: Atualizar sistema canônico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, hashlib
          root=pathlib.Path('.')
          names={'geral':'RAC-5TR — Rastreio Autoaplicável Clínico','tdah':'EIR-TDAH-A — Escala Integrada de Rastreio para TDAH','bipolar':'Bateria de Rastreio — Transtorno Afetivo Bipolar (TAB)','borderline':'Inventário de Traços Borderline','narcisismo':'Bateria de Rastreio — Traços Narcisistas','impulsividade':'Barratt Impulsiveness Scale — BIS-11','esquemas':'Mapa de Esquemas — Inventário de Padrões Emocionais','modos':'SMI 1.1 — Inventário de Modos Esquemáticos','necessidades':'Escala de Rastreio de Necessidades Emocionais','codependencia':'Escala de Dependência e Codependência Emocional','icaps':'ICAPS — Inventário Clínico para Avaliação de Prontidão para Separação','risco':'EIR-RS — Escala Integrada de Risco de Suicídio','humor':'Inventário de Depressão de Beck — BDI-II','ansiedade':'Monitoramento de Ansiedade — estrutura HAM-A (autorrelato adaptado)','autoestima':'Escala de Autoestima de Rosenberg — RSES-BR'}
          cfg=root/'assets/screening-public-experience-v2.json'; data=json.loads(cfg.read_text(encoding='utf-8'))
          for k,v in names.items():
              if k in data.get('instruments',{}): data['instruments'][k]['publicName']=v
          cfg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sysf=root/'assets/screening-system-v2.js'; s=sysf.read_text(encoding='utf-8')
          s2=re.sub(r"const HERO_SCENES=Object\.freeze\(\{.*?\}\);\nfunction heroForInstrument\(id\)\{.*?\}\nfunction hideLegacyPresentation", "function heroForInstrument(){return null}\nfunction hideLegacyPresentation", s, flags=re.S)
          if s2==s and 'const HERO_SCENES' in s: raise SystemExit('HERO_SCENES não removido')
          sysf.write_text(s2,encoding='utf-8')
          mon=root/'monitoramento.html'
          if mon.exists():
              m=mon.read_text(encoding='utf-8'); m=re.sub(r'screening-uniformity-v1\.css\?v=[^\"\']+','screening-uniformity-v1.css?v=4.0.0',m); m=re.sub(r'screening-uniformity-v1\.js\?v=[^\"\']+','screening-uniformity-v1.js?v=4.0.0',m); mon.write_text(m,encoding='utf-8')
          manifest={'version':'4.0.0','total':15,'heroes':[]}
          for k in names:
              p=root/f'assets/heroes/{k}.jpg'; b=p.read_bytes(); manifest['heroes'].append({'id':k,'file':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'title':names[k]})
          (root/'audits/visual-identity-15-v4.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cp assets/screening-visual-v3.css assets/screening-visual-v4.css
          printf '\n/* v4: assets locais; créditos externos não são renderizados. */\n.rm-photo-credit{display:none!important}\n' >> assets/screening-visual-v4.css
          cat > assets/screening-visual-v4.js <<'JS'
          (()=>{'use strict';
          const VERSION='4.0.0-canonical-local';
          const BASE='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/heroes/';
          const REPOS={'Rastreioclinico':'geral','rastreioTDAH':'tdah','tab-bateria-integrada':'bipolar','Inventario-de-Tracos-Borderline':'borderline','bateria.narcisismo':'narcisismo','Rastreio-de-Impulsividade':'impulsividade','rastreio.de.esquemas':'esquemas','rastreiomodosesquematicos':'modos','Escala-de-Necessidades-Emocionais':'necessidades','Escala-de-Co-Depenpencia-Emocional':'codependencia','ICAPS':'icaps','TriagemRiscoSuicidio':'risco'};
          const ALT={geral:'Mesa de avaliação e reflexão clínica, sem pessoas.',tdah:'Planejamento e organização de tarefas, sem pessoas.',bipolar:'Caderno aberto representando ritmo e passagem do tempo, sem pessoas.',borderline:'Composição de espelho e autorreflexão, sem pessoas.',narcisismo:'Peça de xadrez representando autoimagem, posição e reconhecimento, sem pessoas.',impulsividade:'Ampulheta representando pausa entre impulso e ação, sem pessoas.',esquemas:'Raízes expostas representando padrões de longa duração, sem pessoas.',modos:'Máscaras teatrais representando diferentes estados e modos, sem pessoas.',necessidades:'Broto emergindo do solo representando desenvolvimento e cuidado, sem pessoas.',codependencia:'Nó em corda representando vínculo, autonomia e limites, sem pessoas.',icaps:'Placa com duas direções representando avaliação estruturada de decisões, sem pessoas.',risco:'Farol costeiro representando orientação, proteção e continuidade, sem pessoas.',humor:'Janela com chuva representando observação do humor, sem pessoas.',ansiedade:'Fios entrelaçados representando tensão e complexidade, sem pessoas.',autoestima:'Espelho com composição floral representando autopercepção, sem pessoas.'};
          function id(){const seg=location.pathname.split('/').filter(Boolean)[0]||'';return seg==='Inicio-de-Jornada-Terapeutica'?(new URLSearchParams(location.search).get('instrument')||'geral'):(REPOS[seg]||'geral')}
          function splash(){return document.getElementById('rmClinicalSplash')}
          function closeSplash(){const s=splash();if(!s)return;const started=Number(window.__RM_CLINICAL_SPLASH_STARTED||Date.now()),wait=Math.max(0,1850-(Date.now()-started));setTimeout(()=>{s.classList.add('rm-splash-leaving');setTimeout(()=>s.remove(),320)},wait)}
          function updateSplash(){const s=splash(),h=document.querySelector('.rm-screening-shell h1'),t=s?.querySelector('[data-rm-splash-instrument]');if(h&&t){t.textContent=h.textContent.trim();t.hidden=false}}
          function removeLegacy(){const shell=document.querySelector('.rm-screening-shell');document.querySelectorAll('main>.hero,.container>.hero,.wrapper>.hero,.hero-banner,.legacy-hero,.instrument-hero,.hero-image,.banner-image,.banner-wrap').forEach(el=>{if(!(shell&&shell.contains(el)))el.remove()});}
          function apply(){const shell=document.querySelector('.rm-screening-shell');if(!shell)return false;const k=id(),v=shell.querySelector('.rm-screening-visual');let img=v?.querySelector('img');if(v&&!img){img=document.createElement('img');v.appendChild(img)}if(img){img.src=BASE+k+'.jpg?v=4.0.0';img.alt=ALT[k]||ALT.geral;img.loading='eager';img.decoding='async';img.removeAttribute('title')}removeLegacy();updateSplash();document.body.classList.add('rm-canonical-heroes-v4');return true}
          function boot(){if(apply()){closeSplash();return}const o=new MutationObserver(()=>{if(apply()){o.disconnect();closeSplash()}});o.observe(document.documentElement,{childList:true,subtree:true});setTimeout(()=>{o.disconnect();apply();closeSplash()},5000)}
          window.RM_SCREENING_VISUAL_V4={version:VERSION,refresh:apply};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();
          JS
          cat > assets/screening-uniformity-v1.js <<'JS'
          (()=>{'use strict';window.RM_SCREENING_V4_CLIENT=true;const SRC='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-system-v2.js?v=2.4.0-no-svg',SUBMIT='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-submit-v3.js?v=3.1.0',VISUAL='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-visual-v4.js?v=4.0.0';window.__RM_PENDING_DELIVERY=window.__RM_PENDING_DELIVERY||[];window.__RM_CLINICAL_SPLASH_STARTED=Date.now();function splash(){if(document.getElementById('rmClinicalSplash')||!document.body)return;document.querySelectorAll('#splash,.splash,[class*="splash-screen" i],[id*="splash-screen" i]').forEach(n=>n.remove());const s=document.createElement('div');s.id='rmClinicalSplash';s.setAttribute('role','status');s.setAttribute('aria-live','polite');s.setAttribute('aria-label','Preparando instrumento clínico');s.innerHTML='<div class="rm-clinical-opening-card"><div class="rm-clinical-mark" aria-hidden="true">RM</div><p class="rm-clinical-opening-kicker">Richelmy Murta · Psicologia Clínica</p><h1>Rastreio clínico</h1><p data-rm-splash-instrument hidden></p><p>Preparando o instrumento para preenchimento.</p><div class="rm-clinical-opening-loader" aria-hidden="true"></div></div>';document.body.appendChild(s)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',splash,{once:true});else splash();if(!window.RMScreeningUI)window.RMScreeningUI={version:'2.4.0-loading',confirmDelivery(d={}){window.__RM_PENDING_DELIVERY.push(d)},getIdentity(){return {}}};function add(src,m){if(document.querySelector(`script[${m}]`))return;const s=document.createElement('script');s.src=src;s.defer=true;s.setAttribute(m,'true');document.head.appendChild(s)}add(SRC,'data-rm-screening-v2');add(SUBMIT,'data-rm-submit-v3');add(VISUAL,'data-rm-visual-v4')})();
          JS
          cat > assets/screening-uniformity-v1.css <<'CSS'
          @import url('https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-system-v2.css?v=2.4.0-no-svg');
          @import url('https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/screening-visual-v4.css?v=4.0.0');
          CSS
          rm -f assets/screening-visual-v3.js assets/screening-visual-v3.css
      - name: Gate
        run: |
          set -euo pipefail
          test "$(find assets/heroes -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 15
          ! grep -q 'const HERO_SCENES' assets/screening-system-v2.js
          ! grep -RqiE 'images\.unsplash\.com|pinimg\.com' assets/screening-visual-v4.js assets/screening-uniformity-v1.js assets/screening-uniformity-v1.css
          grep -q 'Preparando o instrumento para preenchimento' assets/screening-uniformity-v1.js
          grep -q 'RAC-5TR — Rastreio Autoaplicável Clínico' assets/screening-public-experience-v2.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(rastreios): heroes locais, nomenclatura clínica e splash v4'
          git push
