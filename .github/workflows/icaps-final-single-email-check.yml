name: ICAPS final single-email check

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/icaps-final-single-email-check.yml']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Submit one synthetic ICAPS response
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('assets/screening-transport-v3.json','utf8'));
          const now=Date.now();
          const payload={
            version:'screening-bridge-v3.1',
            instrumentId:'icaps',
            submissionId:'icaps-final-single-'+now,
            identity:{name:'TESTE AUTOMATIZADO · NÃO É PACIENTE · ICAPS FINAL',patientCode:'',age:''},
            responses:Array(60).fill(1),
            startedAt:now-5000,
            submittedAt:now
          };
          fs.writeFileSync('/tmp/payload.json',JSON.stringify(payload));
          fs.writeFileSync('/tmp/url.txt',cfg.bridgeUrl);
          console.log('submissionId='+payload.submissionId);
          NODE
          URL="$(cat /tmp/url.txt)"
          curl -sS -L --max-time 90 -X POST --data-urlencode payload@/tmp/payload.json "$URL" -o /tmp/response.html
          cat /tmp/response.html
          grep -q '"ok":true' /tmp/response.html
          grep -q '"instrumentId":"icaps"' /tmp/response.html
          grep -q '"processing":"complete"' /tmp/response.html
          echo 'ICAPS_FINAL_E2E_PASS'
