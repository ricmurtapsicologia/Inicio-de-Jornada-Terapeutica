name: Decouple screening runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/decouple-screening-runtime.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move shared screening assets off clinical platform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/'
          new='https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/'
          exts={'.html','.htm','.js','.mjs','.css','.md'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.suffix.lower() not in exts: continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              if old+'css/screening-' in t or old+'js/screening-' in t: p.write_text(t.replace(old,new),encoding='utf-8')
          bad=[]
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and '.github' not in p.parts and p.suffix.lower() in exts:
                  t=p.read_text(encoding='utf-8',errors='ignore')
                  if old+'css/screening-' in t or old+'js/screening-' in t: bad.append(str(p))
          if bad: raise SystemExit('OLD_HOST_REMAINS '+','.join(bad))
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'Desacopla monitoramentos da Plataforma Clínica' && git push
