name: Clinical live E2E synthetic verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clinical-live-e2e.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_SYNTHETIC_SUBMISSION: '0'
      SKIP_CONTROL_SUBMISSION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated headless browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Probe Apps Script availability (no POST)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://script.google.com/macros/s/AKfycbyVv6oY91ELP2of25NxPg1QyVPNo1y8CIc6PXrjrmQSxOraQzHfBQJpYepJm2LlglU/exec';
          try {
            const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(18000)});
            const html=await r.text();
            const result={status:r.status,finalHost:new URL(r.url).hostname,bridgeMessage:html.includes('ANAMNESE_SUBMIT_RESULT'),authRequired:/sign in|login|accounts.google.com|access denied/i.test(html),unavailable:/script function not found|file not found|unable to open|não foi possível/i.test(html),bodyChars:html.length,preview:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,200)};
            console.log('ANAMNESE_BRIDGE_GET '+JSON.stringify(result));

            const p=await fetch(url,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({payload:'{}'}),redirect:'follow',signal:AbortSignal.timeout(20000)});
            const phtml=await p.text();
            const ix=phtml.indexOf('ANAMNESE_SUBMIT_RESULT');
            const sample=ix>=0?phtml.slice(Math.max(0,ix-140),ix+320).replace(/<[^>]+>/g,' ').replace(/\s+/g,' '):'message-type-absent';
            console.log('ANAMNESE_BRIDGE_INVALID_POST '+JSON.stringify({status:p.status,finalHost:new URL(p.url).hostname,bodyChars:phtml.length,hasMessage:ix>=0,preview:sample.slice(0,370)}));

            // Uma única submissão sintética para distinguir gravação real de falha no iframe.
            const stamp='TESTE E2E NAO E PACIENTE '+process.env.GITHUB_RUN_ID;
            const answers={
              'Nome completo':stamp,
              'Idade':'30',
              'O que fez você procurar terapia neste momento?':'TESTE TECNICO NAO CLINICO',
              'Se você pudesse me ajudar a compreender o que está mais difícil atualmente, o que me contaria?':'DADO FICTICIO PARA TESTE',
              'Quanto essa situação tem afetado sua vida atualmente?':'0',
              'Em quais áreas da sua vida você percebe maior impacto atualmente?':['Emoções ou humor'],
              'Quando essas dificuldades aparecem, o que costuma acontecer com você?':'TESTE TECNICO - SEM SINTOMAS',
              'Você já fez psicoterapia anteriormente?':'Não',
              'Faz uso atualmente de algum medicamento que considere relevante me informar?':'Não',
              'Se nosso trabalho estiver fazendo diferença na sua vida, o que você gostaria de perceber diferente daqui a alguns meses?':'TESTE TECNICO',
              'Existe neste momento alguma situação urgente relacionada à sua segurança ou à segurança de outra pessoa que você considere importante que eu saiba antes da sessão?':'Não'
            };
            const payload={version:'anamnese-v2',formId:'1fg3ZNgCfkbk4pEJaiNt3xY5vellVGI_129lDx8v-aPI',submissionId:'e2e-backend-'+process.env.GITHUB_RUN_ID,startedAt:Date.now()-20000,submittedAt:Date.now(),answers};
            const v=await fetch(url,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({payload:JSON.stringify(payload)}),redirect:'follow',signal:AbortSignal.timeout(30000)});
            const vh=await v.text();
            const k=vh.indexOf('ANAMNESE_SUBMIT_RESULT');
            const snippet=k>=0?vh.slice(Math.max(0,k-160),k+360).replace(/<[^>]+>/g,' ').replace(/\s+/g,' '):'message-type-absent';
            console.log('ANAMNESE_BRIDGE_VALID_POST '+JSON.stringify({status:v.status,finalHost:new URL(v.url).hostname,marker:stamp,bodyChars:vh.length,hasMessage:k>=0,preview:snippet.slice(0,450)}));
            if(!vh.includes('\\x22ok\\x22:true'))process.exitCode=1;


          }catch(e){console.log('ANAMNESE_BRIDGE_GET '+JSON.stringify({error:String(e).slice(0,200)}));process.exitCode=1;}
          JS
      - name: Live browser smoke without new submissions
        run: node tests/clinical-live-e2e.mjs
