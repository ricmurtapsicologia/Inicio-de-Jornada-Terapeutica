name: Reusable sanitize rastreio v4 simple
on:
  workflow_call:
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Saneamento de referências visuais legadas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'].split('/',1)[1]
          mapping={
            'Rastreioclinico':('geral','RAC-5TR — Rastreio Autoaplicável Clínico'),
            'rastreioTDAH':('tdah','EIR-TDAH-A — Escala Integrada de Rastreio para TDAH'),
            'tab-bateria-integrada':('bipolar','Bateria de Rastreio — Transtorno Afetivo Bipolar (TAB)'),
            'Inventario-de-Tracos-Borderline':('borderline','Inventário de Traços Borderline'),
            'bateria.narcisismo':('narcisismo','Bateria de Rastreio — Traços Narcisistas'),
            'Rastreio-de-Impulsividade':('impulsividade','Barratt Impulsiveness Scale — BIS-11'),
            'rastreio.de.esquemas':('esquemas','Mapa de Esquemas — Inventário de Padrões Emocionais'),
            'rastreiomodosesquematicos':('modos','SMI 1.1 — Inventário de Modos Esquemáticos'),
            'Escala-de-Necessidades-Emocionais':('necessidades','Escala de Rastreio de Necessidades Emocionais'),
            'Escala-de-Co-Depenpencia-Emocional':('codependencia','Escala de Dependência e Codependência Emocional'),
            'ICAPS':('icaps','ICAPS — Inventário Clínico para Avaliação de Prontidão para Separação'),
            'TriagemRiscoSuicidio':('risco','EIR-RS — Escala Integrada de Risco de Suicídio')}
          iid,title=mapping[repo]
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          hero=f'https://ricmurtapsicologia.github.io/Inicio-de-Jornada-Terapeutica/assets/heroes/{iid}.jpg?v=4.0.0'
          patterns={
            'pinimg':r'https?://(?:i\.)?pinimg\.com/[^\"\'\s<>)]+',
            'unsplash':r'https?://images\.unsplash\.com/[^\"\'\s<>)]+',
            'pexels':r'https?://images\.pexels\.com/[^\"\'\s<>)]+',
            'pixabay':r'https?://[^\"\'\s<>)]*pixabay[^\"\'\s<>)]+',
            'localLegacySrc':r'(?i)(?<=src=[\"\'])[^\"\']*(?:hero|banner|splash)[^\"\']*\.(?:jpe?g|png|webp|svg)(?:\?[^\"\']*)?'
          }
          before={k:len(re.findall(v,s,re.I if k!='localLegacySrc' else 0)) for k,v in patterns.items()}
          for k,pat in patterns.items():
              flags=0 if k=='localLegacySrc' else re.I
              try: s=re.sub(pat,hero,s,flags=flags)
              except re.error:
                  if k=='localLegacySrc':
                      s=re.sub(r'(?i)src=([\"\'])[^\"\']*(?:hero|banner|splash)[^\"\']*\.(?:jpe?g|png|webp|svg)(?:\?[^\"\']*)?\1',lambda m:'src='+m.group(1)+hero+m.group(1),s)
                  else: raise
          s=re.sub(r'(?is)<title>.*?</title>',f'<title>{title}</title>',s,count=1)
          s=re.sub(r'(<meta\s+[^>]*(?:property|name)=[\"\'](?:og:title|twitter:title)[\"\'][^>]*content=[\"\'])[^\"\']*([\"\'])',lambda m:m.group(1)+title+m.group(2),s,flags=re.I)
          s=re.sub(r'(<meta\s+[^>]*(?:property|name)=[\"\'](?:og:image|twitter:image)[\"\'][^>]*content=[\"\'])[^\"\']*([\"\'])',lambda m:m.group(1)+hero+m.group(2),s,flags=re.I)
          s=re.sub(r'screening-uniformity-v1\.css\?v=[^\"\']+','screening-uniformity-v1.css?v=4.0.0',s)
          s=re.sub(r'screening-uniformity-v1\.js\?v=[^\"\']+','screening-uniformity-v1.js?v=4.0.0',s)
          s=s.replace('modeToggle.addEventListener','modeToggle?.addEventListener').replace('darkModeToggle.addEventListener','darkModeToggle?.addEventListener')
          p.write_text(s,encoding='utf-8')
          after={k:len(re.findall(v,s,re.I if k!='localLegacySrc' else 0)) for k,v in patterns.items() if k!='localLegacySrc'}
          Path('audits').mkdir(exist_ok=True)
          Path('audits/visual-sanitize-v4.json').write_text(json.dumps({'instrument':iid,'title':title,'canonicalHero':hero,'before':before,'after':after},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if re.search(r'pinimg\.com|images\.unsplash\.com|images\.pexels\.com|pixabay',s,re.I): raise SystemExit('Referência visual externa legada remanescente')
          if 'screening-uniformity-v1.css' in s and 'screening-uniformity-v1.css?v=4.0.0' not in s: raise SystemExit('CSS canônico sem cache-bust v4')
          if 'screening-uniformity-v1.js' in s and 'screening-uniformity-v1.js?v=4.0.0' not in s: raise SystemExit('JS canônico sem cache-bust v4')
          PY
          find . -type f \( -iname '*hero*.jpg' -o -iname '*hero*.jpeg' -o -iname '*hero*.png' -o -iname '*hero*.webp' -o -iname '*banner*.jpg' -o -iname '*banner*.jpeg' -o -iname '*banner*.png' -o -iname '*banner*.webp' -o -iname '*splash*.jpg' -o -iname '*splash*.jpeg' -o -iname '*splash*.png' -o -iname '*splash*.webp' \) ! -path './.git/*' ! -path './.github/*' -print0 | xargs -0 -r git rm -f --ignore-unmatch
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore(visual): remover referências de hero/banner legado e alinhar v4'
          git push
