name: Final layer 3 audit RC
# rerun after removing redundant Font Awesome JS kit

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/final-layer3-rc.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright @axe-core/playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Run E2E QA A11y UX UI
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const AxeBuilder = require('@axe-core/playwright').default;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(String(e)));

              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              const journeyCount=await page.locator('#screeningCanonicalGrid .form-btn').count();
              const resourcesCount=await page.locator('#otherResourcesGrid .form-btn').count();
              if(journeyCount!==15) throw new Error(`${viewport.name}: Journey count ${journeyCount}`);
              if(resourcesCount!==3) throw new Error(`${viewport.name}: resources count ${resourcesCount}`);
              if(await page.locator('iframe[src*="google.com/forms"],iframe[src*="docs.google.com/forms"]').count()) throw new Error(`${viewport.name}: visible Forms iframe`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              if(overflow) throw new Error(`${viewport.name}: horizontal overflow Journey`);
              const axeJourney=await new AxeBuilder({page}).analyze();
              const badJourney=axeJourney.violations.filter(v=>['critical','serious'].includes(v.impact));
              if(badJourney.length) throw new Error(`${viewport.name}: Journey axe ${badJourney.map(v=>v.id).join(',')}`);

              await page.goto('http://127.0.0.1:4173/painel-rastreios/index.html',{waitUntil:'networkidle'});
              if(await page.locator('.card').count()!==15) throw new Error(`${viewport.name}: Panel count`);
              if(await page.locator('#filters .filter').count()!==10) throw new Error(`${viewport.name}: filter count`);
              const filterLabels=await page.locator('#filters .filter').allTextContents();
              for(const expected of ['Todos','Neurodesenvolvimento','Dimensões clínicas','Uso clínico restrito']) if(!filterLabels.includes(expected)) throw new Error(`${viewport.name}: missing filter ${expected}`);
              await page.locator('#search').fill('autoestima');
              if(await page.locator('.card').count()!==1) throw new Error(`${viewport.name}: search filter failed`);
              await page.locator('#search').fill('');
              await page.getByRole('button',{name:'Monitoramento'}).click();
              if(await page.locator('.card').count()!==3) throw new Error(`${viewport.name}: monitoramento filter failed`);
              const panelOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              if(panelOverflow) throw new Error(`${viewport.name}: horizontal overflow Panel`);
              const axePanel=await new AxeBuilder({page}).analyze();
              const badPanel=axePanel.violations.filter(v=>['critical','serious'].includes(v.impact));
              if(badPanel.length) throw new Error(`${viewport.name}: Panel axe ${badPanel.map(v=>v.id).join(',')}`);
              if(errors.length) throw new Error(`${viewport.name}: console errors ${errors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            console.log('FINAL_LAYER3_PASS desktop+mobile · 15/15 · axe serious/critical=0 · filters/search/overflow OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
