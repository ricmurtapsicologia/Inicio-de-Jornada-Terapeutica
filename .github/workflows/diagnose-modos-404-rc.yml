name: Diagnose Modos 404 RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/diagnose-modos-404-rc.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture failed resource URL
        run: |
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const bad=[];p.on('response',r=>{if(r.status()>=400)bad.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});p.on('requestfailed',r=>bad.push({status:'FAILED',url:r.url(),resourceType:r.resourceType(),failure:r.failure()}));await p.goto('https://ricmurtapsicologia.github.io/rastreiomodosesquematicos/',{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(1000);await b.close();fs.mkdirSync('audits/anomalies',{recursive:true});fs.writeFileSync('audits/anomalies/modos-http-errors.json',JSON.stringify({checkedAt:'2026-09-07',errors:bad,status:bad.length?'REVIEW_REQUIRED':'CLEAR'},null,2)+'\n');console.log(JSON.stringify(bad,null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit diagnosis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/anomalies/modos-http-errors.json
          git commit -m 'Identifica recurso 404 em Modos'
          git push
