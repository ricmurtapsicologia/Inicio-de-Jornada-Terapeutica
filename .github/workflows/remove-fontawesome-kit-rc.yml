name: Remove redundant Font Awesome kit RC

on:
  push:
    branches: [rastreios-hub-rc-20260907]
    paths: ['.github/workflows/remove-fontawesome-kit-rc.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rastreios-hub-rc-20260907
      - name: Remove redundant external kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    <!-- Font Awesome (fallback robusto via CDN + kit, sem depender de build) -->\n','    <!-- Font Awesome via CSS CDN único; sem kit JS externo redundante -->\n')
          s=s.replace('    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous" defer></script>\n','')
          s=s.replace('Font Awesome com fallback via CDN','Font Awesome via CSS CDN único')
          p.write_text(s,encoding='utf-8')
          if 'kit.fontawesome.com' in s: raise SystemExit('FONT_AWESOME_KIT_RESIDUE')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove kit Font Awesome redundante da Jornada'
          git push
